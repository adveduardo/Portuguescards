<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronômetro Visual</title>
<style>
  :root{--verde:#27ae60;--amarelo:#f1c40f;--vermelho:#e74c3c;--texto:#243049}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--texto);
    background:linear-gradient(160deg,#fff4d6,#d6f0ff);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:10px 12px 24px;user-select:none;
    transition:background .3s;
  }
  body.alarme{animation:piscar .5s infinite alternate}
  @keyframes piscar{from{background:#ffd6d6}to{background:#ff8a8a}}
  body>*{flex-shrink:0}
  h1{font-size:clamp(1.3rem,4vw,2rem);margin:6px 0}
  button{font:inherit;font-weight:bold;border:none;cursor:pointer;border-radius:16px;padding:12px 18px;font-size:1.05rem;
    background:#fff;color:var(--texto);box-shadow:0 4px 0 #0002;transition:transform .08s,box-shadow .08s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
  button.ativo{background:var(--texto);color:#fff}
  .linha{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  .pizza-wrap{width:min(80vw,52vh,440px);aspect-ratio:1;position:relative;margin:8px 0}
  svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
  #tempo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-family:"Courier New",monospace;font-weight:bold;font-size:clamp(2.6rem,11vw,5.5rem)}
  #tempo small{font-family:inherit;font-size:clamp(.9rem,2.5vw,1.2rem);opacity:.7;font-weight:normal}
  .barra{width:min(92vw,640px);height:26px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px #0002;margin:6px 0}
  #barraFill{height:100%;width:100%;background:var(--verde);transition:width .25s linear,background .5s}
  #btnIniciar{background:var(--verde);color:#fff;font-size:1.3rem;padding:14px 28px}
  #btnIniciar.pausar{background:var(--amarelo);color:var(--texto)}
  .custom{background:#ffffffcc;border-radius:16px;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .custom input[type=number]{width:70px;font:inherit;font-size:1.2rem;padding:6px;border-radius:10px;border:2px solid #ccd;text-align:center}
  .custom label{display:flex;align-items:center;gap:6px}
  .custom input[type=checkbox]{width:22px;height:22px}
  #msg{font-size:clamp(1.4rem,5vw,2.4rem);font-weight:bold;min-height:1.3em;text-align:center;color:var(--vermelho)}
</style>
</head>
<body>
  <h1>⏳ Cronômetro Visual</h1>

  <div class="linha" id="modos">
    <button data-modo="regressivo" class="ativo">⏬ Contagem regressiva</button>
    <button data-modo="progressivo">⏫ Cronômetro</button>
  </div>

  <div class="linha" id="presets">
    <button data-min="1">1 min</button>
    <button data-min="2">2 min</button>
    <button data-min="3">3 min</button>
    <button data-min="5">5 min</button>
    <button data-min="10">10 min</button>
    <button data-min="15">15 min</button>
    <button data-min="20">20 min</button>
    <button data-min="30">30 min</button>
  </div>

  <div class="pizza-wrap">
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="90" fill="#fff" stroke="#e6e9f0" stroke-width="16"/>
      <circle id="arco" cx="100" cy="100" r="90" fill="none" stroke="var(--verde)" stroke-width="16" stroke-linecap="butt"
        stroke-dasharray="565.49" stroke-dashoffset="0" style="transition:stroke-dashoffset .25s linear,stroke .5s"/>
    </svg>
    <div id="tempo">05:00<small id="rotulo">pronto</small></div>
  </div>

  <div class="barra"><div id="barraFill"></div></div>
  <div id="msg"></div>

  <div class="linha">
    <button id="btnIniciar">▶️ Iniciar</button>
    <button id="btnMais">➕ 1 min</button>
    <button id="btnZerar">🔄 Reiniciar</button>
  </div>

  <div class="custom" id="custom">
    <span>Tempo personalizado:</span>
    <input type="number" id="inMin" min="0" max="180" value="5"> min
    <input type="number" id="inSeg" min="0" max="59" value="0"> seg
    <button id="btnDefinir">✔️ Definir</button>
    <label><input type="checkbox" id="chkAviso" checked> Aviso de 1 minuto</label>
    <label><input type="checkbox" id="chkSom" checked> Sons</label>
  </div>

<script>
const $ = id => document.getElementById(id);
const CIRC = 2 * Math.PI * 90;

let modo = 'regressivo';
let duracao = 5 * 60 * 1000;   // ms
let restante = duracao;        // ms (regressivo) / decorrido (progressivo)
let rodando = false;
let marco = 0;                 // performance.now() de referência
let avisou = false;
let timerAlarme = null;

// ---------- Sons ----------
let ac;
function tom(freq, dur = .15, tipo = 'sine', vol = .2, atraso = 0){
  if (!$('chkSom').checked) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + atraso;
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur);
  }catch(e){}
}
const somAviso = () => { tom(880,.2,'triangle',.2); tom(880,.2,'triangle',.2,.3); };
const somAlarme = () => [0,.18,.36,.54].forEach((d,i) => tom(i%2?660:990,.16,'square',.12,d));
const somInicio = () => tom(660,.12,'triangle',.15);

// ---------- Formatação ----------
function fmt(ms){
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), seg = s % 60;
  const mm = String(m).padStart(2,'0'), ss = String(seg).padStart(2,'0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function fmtProg(ms){
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), seg = s % 60;
  const mm = String(m).padStart(2,'0'), ss = String(seg).padStart(2,'0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

// ---------- Desenho ----------
function cor(frac){
  if (frac > .5) return 'var(--verde)';
  if (frac > .2) return 'var(--amarelo)';
  return 'var(--vermelho)';
}
function render(){
  let frac, texto;
  if (modo === 'regressivo'){
    frac = duracao ? restante / duracao : 0;
    texto = fmt(restante);
  } else {
    frac = (restante % 60000) / 60000;   // volta completa a cada minuto
    texto = fmtProg(restante);
  }
  const c = modo === 'regressivo' ? cor(frac) : 'var(--verde)';
  $('arco').style.strokeDashoffset = CIRC * (1 - frac);
  $('arco').style.stroke = c;
  $('barraFill').style.width = (frac * 100) + '%';
  $('barraFill').style.background = c;
  $('tempo').firstChild.nodeValue = texto;
  $('rotulo').textContent = rodando ? (modo === 'regressivo' ? 'faltam' : 'passaram') : (restante === (modo === 'regressivo' ? duracao : 0) ? 'pronto' : 'pausado');
}

// ---------- Laço ----------
function laco(){
  if (!rodando) return;
  const agora = performance.now();
  const dt = agora - marco; marco = agora;
  if (modo === 'regressivo'){
    restante = Math.max(0, restante - dt);
    if (!avisou && $('chkAviso').checked && duracao > 90000 && restante <= 60000 && restante > 0){
      avisou = true; somAviso(); $('msg').textContent = '⚠️ Falta 1 minuto!';
    }
    if (restante <= 0){ terminar(); return; }
  } else {
    restante += dt;
  }
  render();
  requestAnimationFrame(laco);
}

function iniciarPausar(){
  pararAlarme();
  if (rodando){
    rodando = false;
    $('btnIniciar').textContent = '▶️ Continuar';
    $('btnIniciar').classList.remove('pausar');
  } else {
    if (modo === 'regressivo' && restante <= 0) restante = duracao;
    rodando = true; marco = performance.now();
    if ($('msg').textContent.startsWith('⏰')) $('msg').textContent = '';
    somInicio();
    $('btnIniciar').textContent = '⏸️ Pausar';
    $('btnIniciar').classList.add('pausar');
    requestAnimationFrame(laco);
  }
  render();
}
function terminar(){
  rodando = false; restante = 0; render();
  $('btnIniciar').textContent = '▶️ Iniciar';
  $('btnIniciar').classList.remove('pausar');
  $('msg').textContent = '⏰ Tempo esgotado!';
  document.body.classList.add('alarme');
  somAlarme();
  let n = 0;
  timerAlarme = setInterval(() => { if (++n >= 5) return pararAlarme(true); somAlarme(); }, 1000);
}
function pararAlarme(manterMsg){
  clearInterval(timerAlarme); timerAlarme = null;
  document.body.classList.remove('alarme');
  if (!manterMsg && $('msg').textContent.startsWith('⏰')) $('msg').textContent = '';
}
function zerar(){
  pararAlarme();
  rodando = false; avisou = false;
  restante = modo === 'regressivo' ? duracao : 0;
  $('msg').textContent = '';
  $('btnIniciar').textContent = '▶️ Iniciar';
  $('btnIniciar').classList.remove('pausar');
  render();
}
function definir(ms){
  if (ms <= 0) return;
  duracao = ms;
  if (modo !== 'regressivo') mudarModo('regressivo'); else zerar();
  $('inMin').value = Math.floor(ms / 60000);
  $('inSeg').value = Math.floor(ms % 60000 / 1000);
}
function mudarModo(novo){
  modo = novo;
  document.querySelectorAll('#modos button').forEach(b => b.classList.toggle('ativo', b.dataset.modo === novo));
  const reg = novo === 'regressivo';
  $('presets').hidden = !reg; $('custom').style.display = reg ? '' : 'none';
  $('btnMais').hidden = !reg;
  zerar();
}

// ---------- Botões ----------
document.querySelectorAll('#presets button').forEach(b => b.onclick = () => definir(+b.dataset.min * 60000));
document.querySelectorAll('#modos button').forEach(b => b.onclick = () => mudarModo(b.dataset.modo));
$('btnIniciar').onclick = iniciarPausar;
$('btnZerar').onclick = zerar;
$('btnMais').onclick = () => {
  pararAlarme();
  duracao += 60000; restante += 60000;
  if (restante > 60000) avisou = false;
  render();
};
$('btnDefinir').onclick = () => {
  const m = Math.max(0, +$('inMin').value || 0), s = Math.min(59, Math.max(0, +$('inSeg').value || 0));
  definir((m * 60 + s) * 1000);
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); iniciarPausar(); }
  if (e.key === 'r' || e.key === 'R') zerar();
});

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor de Ruído de 12 Níveis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(180deg, #32115e 0%, #5d2294 50%, #46147a 100%); height: 100vh; overflow: hidden; color: #333; position: relative; }
        
        .landscape {
            position: absolute; bottom: 0; width: 100%; height: 50%;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,50 L20,30 L40,60 L70,20 L100,50 L100,100 L0,100 Z" fill="%232b0c51" opacity="0.6"/></svg>') no-repeat bottom center;
            background-size: 100% 100%; z-index: 1;
        }

        .panel { background: rgba(240, 240, 245, 0.95); border-radius: 16px; padding: 20px; position: absolute; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 10; }
        
        /* Painel Esquerdo */
        .timer-panel { top: 40px; left: 40px; width: 220px; text-align: center; }
        .time-display { font-size: 42px; font-weight: bold; color: #1a1a1a; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .time-display svg { width: 24px; height: 24px; fill: #5d9cec; }
        .mode-text { font-size: 12px; color: #888; margin: 5px 0 15px 0; }
        .btn-outline { background: transparent; border: 1px solid #ccc; padding: 10px 20px; border-radius: 20px; cursor: pointer; width: 100%; font-weight: 600; color: #555; transition: 0.2s; }
        .btn-outline:hover { background: #e0e0e0; }

        /* Painel Direito */
        .controls-panel { top: 40px; right: 40px; width: 260px; }
        .top-controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-stop { flex: 1; background: #f05a5b; color: white; border: none; padding: 10px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-icon { background: #fff; border: 1px solid #ddd; width: 40px; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold; color: #555;}
        .btn-icon:hover { background: #eee; }
        
        .dropdown { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 15px; color: #555; font-weight: bold; }
        
        .slider-container { margin-bottom: 20px; }
        .slider-container label { display: block; font-size: 12px; color: #666; margin-bottom: 8px; font-weight: bold; }
        input[type=range] { width: 100%; accent-color: #5d9cec; }
        .slider-labels { display: flex; justify-content: space-between; font-size: 10px; color: #999; margin-top: 4px; }
        
        .noise-level { height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden; display: flex; }
        .noise-level-fill { height: 100%; width: 0%; background: #50c878; transition: width 0.1s ease-out, background-color 0.2s; }

        /* Personagem Central */
        .character-container { 
            position: absolute; 
            bottom: 50px; 
            left: 0; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: flex-end;
            z-index: 5; 
            pointer-events: none; 
        }
        
        .character-container img { 
            width: 480px; 
            height: 480px; 
            object-fit: contain; 
            transition: transform 0.15s ease-out; 
            transform-origin: bottom center; 
        }

        /* Overlay Inicial */
        #startOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #startOverlay button { padding: 15px 30px; font-size: 20px; background: #5d9cec; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="startOverlay">
        <h2>Medidor de Ruído</h2>
        <p>Precisamos de acesso ao seu microfone para funcionar.</p>
        <button onclick="iniciarApp()">Permitir e Iniciar</button>
    </div>

    <div class="landscape"></div>

    <div class="panel timer-panel">
        <div class="time-display">
            <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <span id="timer">00:00</span>
        </div>
        <div class="mode-text" id="mode-text">Modo Cronômetro</div>
        <button class="btn-outline" id="btn-goal">◎ Definir Meta</button>
    </div>

    <div class="panel controls-panel">
        <div class="top-controls">
            <button class="btn-stop" id="btn-stop">⏸ Parar</button>
            <button class="btn-icon" id="btn-reset">↺</button>
        </div>
        
        <select class="dropdown" id="character-select">
            <option value="monstro">👾 Monstro</option>
            <option value="capivara">🦦 Capivara</option>
        </select>

        <div class="slider-container">
            <label>Sensibilidade do Microfone</label>
            <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1.5">
            <div class="slider-labels">
                <span>Menos</span>
                <span>Mais</span>
            </div>
        </div>

        <div class="slider-container" style="margin-bottom: 0;">
            <label>Nível de Ruído</label>
            <div class="noise-level">
                <div class="noise-level-fill" id="noise-bar"></div>
            </div>
        </div>
    </div>

    <div class="character-container">
        <img id="character-img" src="imagens/monstro/1.png" alt="Personagem">
    </div>

    <script>
        // --- CONFIGURAÇÃO DAS 12 IMAGENS (AGORA DE 1 a 12) ---
        const characterImages = {
            monstro: [
                "imagens/monstro/1.png", "imagens/monstro/2.png", "imagens/monstro/3.png", "imagens/monstro/4.png",
                "imagens/monstro/5.png", "imagens/monstro/6.png", "imagens/monstro/7.png", "imagens/monstro/8.png",
                "imagens/monstro/9.png", "imagens/monstro/10.png", "imagens/monstro/11.png", "imagens/monstro/12.png"
            ],
            capivara: [
                "imagens/capivara/1.png", "imagens/capivara/2.png", "imagens/capivara/3.png", "imagens/capivara/4.png",
                "imagens/capivara/5.png", "imagens/capivara/6.png", "imagens/capivara/7.png", "imagens/capivara/8.png",
                "imagens/capivara/9.png", "imagens/capivara/10.png", "imagens/capivara/11.png", "imagens/capivara/12.png"
            ]
        };

        // Variáveis Globais
        let currentCharacter = 'monstro';
        let currentImageIndex = 0;
        let targetImageIndex = 0;        // índice desejado baseado no volume
        let lastSpriteChangeTime = 0;
        const SPRITE_CHANGE_DELAY_MS = 250;  // tempo mínimo entre trocas (mais lento e natural)
        
        let smoothedVolume = 0;
        let audioContext;
        let analyser;
        
        // Controles de Tempo
        let seconds = 0;
        let timerInterval;
        let isRunning = false;
        let isCountdown = false;
        let goalSeconds = 0;

        // Trocar de personagem
        document.getElementById('character-select').addEventListener('change', function(e) {
            currentCharacter = e.target.value;
            document.getElementById('character-img').src = characterImages[currentCharacter][currentImageIndex];
        });

        // Atualiza o texto do relógio
        function updateTimerDisplay() {
            let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            let secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }

        // Lógica de tempo
        function runTimerLogic() {
            if (!isRunning) return;
            
            if (isCountdown) {
                if (seconds > 0) seconds--;
            } else {
                seconds++;
            }
            updateTimerDisplay();
        }

        // Eventos de Tempo
        document.getElementById('btn-reset').addEventListener('click', () => {
            seconds = isCountdown ? goalSeconds : 0;
            updateTimerDisplay();
        });

        document.getElementById('btn-goal').addEventListener('click', () => {
            let userInput = prompt("Tempo em minutos (ex: 5). Branco para cronômetro normal:");
            
            if (userInput !== null && userInput.trim() !== "" && !isNaN(userInput) && userInput > 0) {
                isCountdown = true;
                goalSeconds = Math.floor(parseFloat(userInput) * 60);
                seconds = goalSeconds;
                document.getElementById('mode-text').innerText = "Meta: " + userInput + " min";
            } else {
                isCountdown = false;
                seconds = 0;
                document.getElementById('mode-text').innerText = "Modo Cronômetro";
            }
            updateTimerDisplay();
        });

        // Botão de Parar/Continuar
        document.getElementById('btn-stop').addEventListener('click', function() {
            if (!audioContext) return; 
            
            isRunning = !isRunning;
            
            if (isRunning) {
                this.innerHTML = '⏸ Parar';
                this.style.background = '#f05a5b';
                audioContext.resume(); 
            } else {
                this.innerHTML = '▶ Continuar';
                this.style.background = '#50c878'; 
                audioContext.suspend(); 
                
                // Reset visual e lógico
                document.getElementById('noise-bar').style.width = '0%';
                currentImageIndex = 0;
                targetImageIndex = 0;
                document.getElementById('character-img').src = characterImages[currentCharacter][0];
                document.getElementById('character-img').style.transform = `scale(1)`;
                smoothedVolume = 0;
            }
        });

        // Atalho (Espaço)
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault(); 
                document.getElementById('btn-stop').click(); 
            }
        });

        // Função Principal
        async function iniciarApp() {
            document.getElementById('startOverlay').style.display = 'none';
            isRunning = true;
            timerInterval = setInterval(runTimerLogic, 1000);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                
                analyser.fftSize = 256;
                source.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                const noiseBar = document.getElementById('noise-bar');
                const sensitivitySlider = document.getElementById('sensitivity');
                const characterImg = document.getElementById('character-img');

                function analisarAudio() {
                    if (!isRunning) {
                        requestAnimationFrame(analisarAudio);
                        return;
                    }

                    analyser.getByteFrequencyData(dataArray);
                    
                    let sum = 0;
                    for(let i = 0; i < bufferLength; i++) sum += dataArray[i];
                    let rawVolume = sum / bufferLength;

                    let sensitivity = parseFloat(sensitivitySlider.value);
                    let volumePercent = Math.min(((rawVolume * sensitivity) / 100) * 100, 100);

                    smoothedVolume = (smoothedVolume * 0.85) + (volumePercent * 0.15);

                    noiseBar.style.width = smoothedVolume + '%';
                    if(smoothedVolume > 80) noiseBar.style.background = '#f05a5b';
                    else if(smoothedVolume > 50) noiseBar.style.background = '#ffb74d';
                    else noiseBar.style.background = '#50c878';

                    // Calcula o índice alvo baseado no volume (0 a 11)
                    let newTargetIndex = Math.floor(smoothedVolume / (100 / 12));
                    if (smoothedVolume < 4) newTargetIndex = 0;
                    if (newTargetIndex > 11) newTargetIndex = 11;
                    if (newTargetIndex < 0) newTargetIndex = 0;
                    
                    targetImageIndex = newTargetIndex;
                    
                    // --- Troca mais lenta e natural: só muda o sprite após um delay e se o índice alvo for diferente do atual ---
                    const now = Date.now();
                    if (targetImageIndex !== currentImageIndex && (now - lastSpriteChangeTime) >= SPRITE_CHANGE_DELAY_MS) {
                        // Move o índice atual em direção ao alvo (apenas 1 passo por vez)
                        if (targetImageIndex > currentImageIndex) {
                            currentImageIndex++;
                        } else if (targetImageIndex < currentImageIndex) {
                            currentImageIndex--;
                        }
                        // Atualiza a imagem e o scale
                        characterImg.src = characterImages[currentCharacter][currentImageIndex];
                        characterImg.style.transform = `scale(${1 + (currentImageIndex * 0.03)})`;
                        lastSpriteChangeTime = now;
                    }

                    requestAnimationFrame(analisarAudio);
                }

                analisarAudio();

            } catch (err) {
                alert('Erro ao acessar o microfone. Verifique as permissões.');
            }
        }
    </script>
</body>
</html>

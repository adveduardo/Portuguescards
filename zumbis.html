<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zumbis da Ortografia</title>
<link rel="stylesheet" href="arcade.css">
<style>
  #painel{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(20,16,40,.88);padding:8px 10px 10px;text-align:center;display:none}
  #frase{color:#fff;font-size:20px;margin:2px 0 6px}
  #frase mark{background:#ff6b6b;color:#fff;border-radius:6px;padding:0 6px}
  #ops button{font-size:24px;min-width:150px;margin:4px 6px}
</style>
<script src="visual.js"></script>
<script src="sala.js"></script>
<script src="arcade.js"></script>
</head>
<body>
<canvas id="cv" class="palcoJogo"></canvas>
<div id="hud" style="display:none">
  <span class="chip" id="hVez"></span><span class="chip" id="hOnda"></span><span class="chip" id="hVidas"></span><span class="chip" id="hPontos"></span>
  <button type="button" id="btPausa">⏸️</button><button type="button" id="btSom">🔊</button>
</div>
<div id="painel"><div id="frase"></div><div id="ops"></div></div>
<div id="aviso"></div>
<div class="tela ativa" id="tConfig"><div class="cartao">
  <h1>💀 Zumbis da Ortografia</h1>
  <p>Zumbis vêm andando até a escola com <b>palavras escritas errado</b>. Para curar o zumbi da frente, escolha a <b>escrita certa</b>! Se um zumbi chegar à escola, vocês perdem um coração.</p>
  <label>Palavras: <select id="selArquivo" style="max-width:560px"></select></label>
  <p class="dica" id="infoArq">Carregando…</p>
  <label>Zumbis por onda: <select id="selQtd"><option>6</option><option selected>8</option><option>12</option></select></label>
  <label>Velocidade: <select id="selVel"><option value="0.75">devagar</option><option value="1" selected>normal</option><option value="1.35">rápida</option></select></label>
  <label>Equipes: <select id="selEquipes"><option value="1">1 (turma toda)</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label>
  <p><button type="button" class="principal" id="btComecar">▶️ Começar</button></p>
  <p class="dica">Clique na resposta ou use as teclas 1, 2, 3 e 4.</p>
</div></div>
<div class="tela" id="tVez"><div class="cartao" id="cVez"></div></div>
<div class="tela" id="tFim"><div class="cartao" id="cFim"></div></div>
<script>
(function(){
  'use strict';
  var $ = ARC.$, esc = ARC.esc, itens = [], jogo = null, laco = ARC.laco(passo), tela = ARC.canvas($('cv'), function(){ if (!laco.rodando) desenhar(); }), ctx = tela.ctx;

  ARC.seletor($('selArquivo'), 'detetive', 'detetive-padrao.json', function(arq){
    $('infoArq').textContent = 'Carregando…'; itens = [];
    ARC.json('dados/' + arq, function(d){
      (d.frases || []).forEach(function(f){
        if (!f || !f.errada || !f.correta) return;
        var ops = [String(f.correta)];
        (f.opcoes || []).forEach(function(o){ o = String(o); if (ops.indexOf(o) < 0 && o !== f.errada) ops.push(o); });
        if (ops.length < 2) ops.push(String(f.errada));
        itens.push({frase: String(f.frase || ''), errada: String(f.errada), correta: String(f.correta), ops: ops.slice(0, 4)});
      });
      $('infoArq').textContent = itens.length ? (d.titulo || arq) + ' • ' + itens.length + ' palavras' : 'Este arquivo não tem palavras para corrigir.';
    }, function(){ $('infoArq').textContent = 'Não consegui abrir dados/' + arq; });
  });

  function comecar(){
    if (itens.length < 3) return ARC.aviso('Escolha um arquivo de palavras.');
    jogo = {monte: ARC.embaralhar(itens), usadas: 0, equipes: ARC.criarEquipes(+$('selEquipes').value), vez: 0, qtd: +$('selQtd').value, velBase: +$('selVel').value, onda: 1};
    abrirVez();
  }
  function abrirVez(){
    var eq = jogo.equipes[jogo.vez];
    $('cVez').innerHTML = '<h2>🌙 Onda ' + jogo.onda + (jogo.equipes.length > 1 ? ': vez dos ' + eq.emoji + ' ' + esc(eq.nome) : '') + '</h2>' +
      '<p>Vêm aí ' + jogo.qtd + ' zumbis. Protejam a escola: vocês têm 3 corações!</p>' +
      (jogo.equipes.length > 1 ? '<div class="placar">' + ARC.placarHTML(jogo.equipes, jogo.vez) + '</div>' : '') +
      '<button type="button" class="principal" id="btIr">💀 Que venham!</button>';
    ARC.tela('tVez'); $('btIr').onclick = iniciarOnda;
  }
  function iniciarOnda(){
    jogo.zumbis = []; jogo.fx = []; jogo.vidas = 3; jogo.criados = 0; jogo.curados = 0; jogo.escaparam = 0; jogo.gerar = 0.3; jogo.tremer = 0; jogo.acabou = false; jogo.frente = undefined;
    ARC.tela(null); $('hud').style.display = ''; $('painel').style.display = 'block'; atualizarHud(); laco.pausado = false; laco.iniciar();
  }
  function atualizarHud(){
    var eq = jogo.equipes[jogo.vez];
    $('hVez').textContent = jogo.equipes.length > 1 ? eq.emoji + ' ' + eq.nome : '🏫 Escola';
    $('hOnda').textContent = '💀 ' + jogo.curados + '/' + jogo.qtd + ' curados';
    $('hVidas').textContent = '❤️❤️❤️'.slice(0, jogo.vidas * 2) + '♡♡♡'.slice(0, 3 - jogo.vidas);
    $('hPontos').textContent = '⭐ ' + eq.pontos;
  }
  function casaX(){ return 190 * tela.ESC; }
  function novoZumbi(){
    if (jogo.usadas >= jogo.monte.length){ jogo.monte = ARC.embaralhar(jogo.monte); jogo.usadas = 0; }
    var it = jogo.monte[jogo.usadas++], E = tela.ESC, acel = 1 + jogo.criados * 0.06;
    jogo.zumbis.push({it: it, x: tela.W + 40 * E, y: tela.H - 170 * E - (jogo.criados % 3) * 18 * E, v: (26 + Math.random() * 10) * E * jogo.velBase * acel, passo: Math.random() * 6, ops: ARC.embaralhar(it.ops), crianca: sortearCrianca()});
    jogo.criados++;
  }
  function frente(){ var f = null; jogo.zumbis.forEach(function(z){ if (!z.curado && (!f || z.x < f.x)) f = z; }); return f; }
  function mostrarPainel(){   // jogo.frente = undefined força redesenhar o painel
    var f = frente();
    if (f === jogo.frente) return;
    jogo.frente = f;
    if (!f){ $('frase').innerHTML = jogo.criados < jogo.qtd ? 'Lá vem mais um…' : ''; $('ops').innerHTML = ''; return; }
    var fr = esc(f.it.frase).replace(esc(f.it.errada), '<mark>' + esc(f.it.errada) + '</mark>');
    $('frase').innerHTML = (f.it.frase ? fr : '<mark>' + esc(f.it.errada) + '</mark>') + ' &nbsp;→ como se escreve?';
    $('ops').innerHTML = f.ops.map(function(o, i){ return '<button type="button" data-i="' + i + '">' + (i + 1) + ') ' + esc(o) + '</button>'; }).join('');
    var bs = $('ops').querySelectorAll('button');
    for (var k = 0; k < bs.length; k++) bs[k].onclick = function(){ responder(+this.getAttribute('data-i')); };
  }
  function responder(i){
    var f = jogo.frente; if (!f || jogo.acabou || laco.pausado) return;
    var eq = jogo.equipes[jogo.vez];
    if (f.ops[i] === f.it.correta){
      f.curado = true; f.tempoCura = 0; jogo.curados++;
      var bonus = f.x > tela.W * 0.6 ? 5 : 0; eq.pontos += 10 + bonus; ARC.plim();
      jogo.fx.push({x: f.x, y: f.y - 60 * tela.ESC, t: 0, txt: '✓ ' + f.it.correta + (bonus ? ' +15' : ' +10'), cor: '#1f9d6b'});
      atualizarHud(); jogo.frente = undefined; mostrarPainel();
      if (jogo.curados + jogo.escaparam >= jogo.qtd) fimDaOnda();
    } else {
      f.v *= 1.4; ARC.erro();
      ARC.aviso('❌ “' + esc(f.ops[i]) + '” também está errado! O zumbi ficou mais rápido!', 1600);
      var b = $('ops').querySelector('[data-i="' + i + '"]'); if (b){ b.disabled = true; b.style.opacity = 0.4; }
    }
  }
  function passo(dt){
    if (dt && jogo && !jogo.acabou){
      jogo.gerar -= dt;
      if (jogo.gerar <= 0 && jogo.criados < jogo.qtd){ novoZumbi(); jogo.gerar = ARC.aleat(3.2, 4.6) / jogo.velBase; }
      for (var i = jogo.zumbis.length - 1; i >= 0; i--){
        var z = jogo.zumbis[i];
        if (z.curado){ z.tempoCura += dt; if (z.tempoCura > 1.2) jogo.zumbis.splice(i, 1); continue; }
        z.x -= z.v * dt; z.passo += dt * 4;
        if (z.x < casaX() + 40 * tela.ESC){
          jogo.zumbis.splice(i, 1); jogo.vidas--; jogo.tremer = 0.6; jogo.escaparam++; ARC.tom(140, 0.5, 0, 'sawtooth');
          ARC.aviso('🏫 Um zumbi entrou na escola! A escrita certa era: <b>' + esc(z.it.correta) + '</b>', 2600);
          jogo.frente = undefined; atualizarHud();
          if (jogo.vidas <= 0 || jogo.curados + jogo.escaparam >= jogo.qtd){ fimDaOnda(); break; }
        }
      }
      if (jogo.tremer > 0) jogo.tremer -= dt;
      for (var k = jogo.fx.length - 1; k >= 0; k--){ jogo.fx[k].t += dt; if (jogo.fx[k].t > 1.3) jogo.fx.splice(k, 1); }
      mostrarPainel();
    }
    desenhar();
  }
  function fimDaOnda(){
    jogo.acabou = true;
    setTimeout(function(){
      laco.parar(); $('hud').style.display = 'none'; $('painel').style.display = 'none';
      var ultima = jogo.vez === jogo.equipes.length - 1;
      $('cVez').innerHTML = '<h2>' + (jogo.vidas > 0 ? '🌅 A escola está salva!' : '💀 Os zumbis venceram desta vez!') + '</h2>' +
        '<div class="placar">' + ARC.placarHTML(jogo.equipes, jogo.vez) + '</div>' +
        '<button type="button" class="principal" id="btSegue">' + (ultima ? '🏆 Resultado' : '➡️ Próxima equipe') + '</button>' + (ultima ? ' <button type="button" id="btMais">🔁 Mais uma onda</button>' : '');
      ARC.tela('tVez'); if (jogo.vidas > 0) ARC.festa();
      $('btSegue').onclick = function(){ if (ultima) fim(); else { jogo.vez++; abrirVez(); } };
      if ($('btMais')) $('btMais').onclick = function(){ jogo.vez = 0; jogo.onda++; jogo.velBase *= 1.15; abrirVez(); };
    }, 800);
  }
  function fim(){
    var r = ARC.ranking(jogo.equipes);
    $('cFim').innerHTML = '<h1>🏆 ' + (jogo.equipes.length > 1 ? r[0].e.emoji + ' ' + esc(r[0].e.nome) + ' venceu!' : jogo.equipes[0].pontos + ' pontos!') + '</h1>' +
      '<div class="placar">' + ARC.placarHTML(r.map(function(x){ return x.e; })) + '</div><button type="button" class="principal" id="btDeNovo">🔁 Jogar de novo</button>';
    ARC.tela('tFim'); ARC.festa(); $('btDeNovo').onclick = function(){ ARC.tela('tConfig'); };
  }
  // ---------- sprites em pixel art (desenhados uma vez em telinhas e ampliados sem borrar) ----------
  var PAL = {k: '#16130f', g: '#86a95f', G: '#5f7d3f', w: '#ece6c8', r: '#c0392b', h: '#3a2a1e', s: '#6b7c8f', S: '#4b5866', p: '#8a6a4a', m: '#3b1f1a', n: '#3e3a5c', N: '#2a2742', b: '#2b2b2b', f: '#f2c48d', F: '#d9a066', c: '#3fae6a', C: '#2c7d4c', y: '#ffd54a'};
  var SPR = {
    a: ['....kkkkkk......', '...khhhhhhk.....', '..khhhhhhhhk....', '..kgggggghhk....', '..kgwwggwwgk....', '..kgwrggwrGk....', '..kggggggGGk....', '..kgmmmmgGGk....', '...kggggGGk.....', '....kkggkk......',
      'kkkkkksssSSk....', 'kggggksssSSk....', 'kggggkspSSSk....', 'kkkkkksspsSk....', '.....ksssSSk....', '.....kSsSkSk....', '.....kkkkkkk....', '.....knnnNNk....', '.....knnkNNk....', '....knnk.kNNk...', '....knk...kNk...', '...kbbk...kbbk..', '...kbbbk..kbbbk.', '................'],
    b: ['....kkkkkk......', '...khhhhhhk.....', '..khhhhhhhhk....', '..kgggggghhk....', '..kgwwggwwgk....', '..kgwrggwrGk....', '..kggggggGGk....', '..kgmmmmgGGk....', '...kggggGGk.....', '....kkggkk......',
      '.....ksssSSk....', 'kkkkkksssSSk....', 'kggggkspSSSk....', 'kggggksspsSk....', 'kkkkkksssSSk....', '.....kSsSkSk....', '.....kkkkkkk....', '.....knnnNNk....', '......knnNk.....', '......knNNk.....', '......knNNk.....', '.....kbbbbk.....', '.....kbbbbbk....', '................'],
    c: ['....kkkkkk......', '...khhhhhhk.....', '..khhhhhhhhk....', '..kffffffhhk....', '..kfkffkffhk....', '..kffffffffk....', '..kfmffffmfk....', '..kffmmmmfFk....', '...kffffFFk.....', 'kk..kkffkk..kk..',
      'kfk.kccccck.kfk.', '.kfkkcccCCkkfk..', '..kkcccccCCkk...', '....kcccCCCk....', '....kccyyCCk....', '....kcccCCCk....', '....kkkkkkkk....', '....knnnnNNk....', '....knnkkNNk....', '....knk..kNk....', '....knk..kNk....', '...kbbk..kbbk...', '...kbbbk.kbbbk..', '................']
  };
  // crianças: cabeças (cabelo) e corpos (roupa) que se combinam, com várias cores de pele, cabelo e roupa
  var CABECAS = {
    curto: ['....kkkkkk......', '...khhhhhhk.....', '..khhhhhhhhk....', '..kffffffhhk....', '..kfkffkffhk....', '..kffffffffk....', '..kfmffffmfk....', '..kffmmmmfFk....', '...kffffFFk.....', 'kk..kkffkk..kk..'],
    longo: ['....kkkkkk......', '...khhhhhhk.....', '..khhhhhhhhk....', '.khffffffhhhk...', '.khfkffkffhhk...', '.khffffffffhk...', '.khfmffffmfhk...', '.khffmmmmfFhk...', '.khhkffffFkhhk..', 'kkhhkkffkkhhkk..'],
    rabo: ['....kkkkkk......', '...khhhhhhk.....', '..khhhhhhhhkk...', '..kffffffhhkhk..', '..kfkffkffhkhhk.', '..kffffffffkhhk.', '..kfmffffmfk.hk.', '..kffmmmmfFk.k..', '...kffffFFk.....', 'kk..kkffkk..kk..'],
    crespo: ['...kkkkkkkk.....', '..khhhhhhhhk....', '.khhhhhhhhhhk...', '.khhffffffhhk...', '..kfkffkffhk....', '..kffffffffk....', '..kfmffffmfk....', '..kffmmmmfFk....', '...kffffFFk.....', 'kk..kkffkk..kk..'],
    laco: ['....kkkkkk.kk...', '...khhhhhhklk...', '..khhhhhhhhkk...', '..kffffffhhk....', '..kfkffkffhk....', '..kffffffffk....', '..kfmffffmfk....', '..kffmmmmfFk....', '...kffffFFk.....', 'kk..kkffkk..kk..']
  };
  var CORPOS = {
    calca: ['kfk.kccccck.kfk.', '.kfkkcccCCkkfk..', '..kkcccccCCkk...', '....kcccCCCk....', '....kccyyCCk....', '....kcccCCCk....', '....kkkkkkkk....', '....knnnnNNk....', '....knnkkNNk....', '....knk..kNk....', '....knk..kNk....', '...kbbk..kbbk...', '...kbbbk.kbbbk..', '................'],
    vestido: ['kfk.kccccck.kfk.', '.kfkkcccCCkkfk..', '..kkcccccCCkk...', '....kcccCCCk....', '....kccyyCCk....', '...kcccccCCCk...', '..kcccccccCCCk..', '..kkkkkkkkkkkk..', '.....kfk.kfk....', '.....kfk.kfk....', '.....kfk.kfk....', '....kbbk.kbbk...', '....kbbbkkbbbk..', '................']
  };
  var PELES = [['#f6d3b3', '#e3b28a'], ['#f2c48d', '#d9a066'], ['#c68642', '#a86b32'], ['#8d5524', '#6e4119'], ['#5c3a1e', '#452a14']];
  var CABELOS = ['#2b1d14', '#4a3121', '#7a4b2a', '#d9b26f', '#111111', '#a0522d'];
  var ROUPAS = [['#3fae6a', '#2c7d4c'], ['#2f80ed', '#1f5fb8'], ['#e5484d', '#b4343a'], ['#8e4ec6', '#6b3a99'], ['#f2994a', '#c97a34'], ['#0e9f9f', '#0a7676'], ['#ec6fa8', '#c4528a'], ['#f5c518', '#c99f10']];
  var CALCAS = [['#3e3a5c', '#2a2742'], ['#2c4a7a', '#1f355a'], ['#5b4636', '#423226']];
  function sortearCrianca(){   // metade meninas, metade meninos, em todas as cores
    var menina = Math.random() < 0.5, r = function(n){ return Math.floor(Math.random() * n); };
    return {cab: menina ? ['longo', 'rabo', 'laco', 'crespo'][r(4)] : ['curto', 'crespo', 'curto'][r(3)], corpo: menina && Math.random() < 0.6 ? 'vestido' : 'calca', pele: r(PELES.length), cabelo: r(CABELOS.length), roupa: r(ROUPAS.length), calca: r(CALCAS.length), laco: ['#ec4899', '#ef4444', '#a855f7'][r(3)]};
  }
  function spriteCrianca(v){
    var chave = 'cr' + v.cab + v.corpo + v.pele + v.cabelo + v.roupa + v.calca + v.laco;
    if (telinhas[chave]) return telinhas[chave];
    var pal = {}, k; for (k in PAL) pal[k] = PAL[k];
    pal.f = PELES[v.pele][0]; pal.F = PELES[v.pele][1]; pal.h = CABELOS[v.cabelo]; pal.c = ROUPAS[v.roupa][0]; pal.C = ROUPAS[v.roupa][1]; pal.n = CALCAS[v.calca][0]; pal.N = CALCAS[v.calca][1]; pal.l = v.laco; pal.y = '#fff3c4';
    return (telinhas[chave] = pintarTelinha(CABECAS[v.cab].concat(CORPOS[v.corpo]), pal));
  }
  function pintarTelinha(lin, pal){
    var c = document.createElement('canvas'), cx = c.getContext('2d'), x, y, ch;
    c.width = 16; c.height = lin.length;
    for (y = 0; y < lin.length; y++) for (x = 0; x < 16; x++){ ch = lin[y].charAt(x); if (ch && ch !== '.' && pal[ch]){ cx.fillStyle = pal[ch]; cx.fillRect(x, y, 1, 1); } }
    return c;
  }
  var telinhas = {};
  function sprite(nome){
    if (telinhas[nome]) return telinhas[nome];
    var lin = SPR[nome], c = document.createElement('canvas'), cx = c.getContext('2d'), x, y, ch;
    c.width = 16; c.height = lin.length;
    for (y = 0; y < lin.length; y++) for (x = 0; x < 16; x++){ ch = lin[y].charAt(x); if (ch && ch !== '.' && PAL[ch]){ cx.fillStyle = PAL[ch]; cx.fillRect(x, y, 1, 1); } }
    return (telinhas[nome] = c);
  }
  function desenharSprite(nome, x, pe, px){   // x = meio, pe = chão, px = tamanho do pixel (nome pode ser uma criança sorteada)
    var c = typeof nome === 'string' ? sprite(nome) : spriteCrianca(nome);
    ctx.imageSmoothingEnabled = false; ctx.webkitImageSmoothingEnabled = false; ctx.mozImageSmoothingEnabled = false;
    ctx.drawImage(c, Math.round(x - 8 * px), Math.round(pe - c.height * px), Math.round(16 * px), Math.round(c.height * px));
  }
  // ---------- o prédio da escola ----------
  function desenharEscola(cx, base, E){
    var x0 = 6 * E, x1 = cx + 40 * E, w = x1 - x0, h = 230 * E, topo = base - h, i, j, mx = x0 + w / 2;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x0 + 8 * E, topo + 10 * E, w, h);   // sombra
    ctx.fillStyle = '#b5523a'; ctx.fillRect(x0, topo, w, h);   // tijolos
    ctx.strokeStyle = 'rgba(255,220,200,.25)'; ctx.lineWidth = Math.max(1, E);
    for (j = topo + 10 * E; j < base; j += 12 * E){ ctx.beginPath(); ctx.moveTo(x0, j); ctx.lineTo(x1, j); ctx.stroke(); for (i = x0 + ((Math.round((j - topo) / (12 * E)) % 2) ? 12 : 0) * E; i < x1; i += 24 * E){ ctx.beginPath(); ctx.moveTo(i, j); ctx.lineTo(i, j + 12 * E); ctx.stroke(); } }
    ctx.fillStyle = '#7d2f22'; ctx.beginPath(); ctx.moveTo(x0 - 14 * E, topo); ctx.lineTo(mx, topo - 62 * E); ctx.lineTo(x1 + 14 * E, topo); ctx.closePath(); ctx.fill();   // frontão
    ctx.fillStyle = '#f4ead2'; ctx.beginPath(); ctx.arc(mx, topo - 26 * E, 17 * E, 0, 2 * Math.PI); ctx.fill();   // relógio
    ctx.strokeStyle = '#3b2a1e'; ctx.lineWidth = 2.5 * E; ctx.beginPath(); ctx.moveTo(mx, topo - 26 * E); ctx.lineTo(mx, topo - 38 * E); ctx.moveTo(mx, topo - 26 * E); ctx.lineTo(mx + 8 * E, topo - 22 * E); ctx.stroke();
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3 * E; ctx.beginPath(); ctx.moveTo(mx, topo - 62 * E); ctx.lineTo(mx, topo - 112 * E); ctx.stroke();   // bandeira
    var ond = Math.sin(Date.now() / 300) * 3 * E;
    ctx.fillStyle = '#2f80ed'; ctx.beginPath(); ctx.moveTo(mx, topo - 112 * E); ctx.lineTo(mx + 34 * E, topo - 104 * E + ond); ctx.lineTo(mx, topo - 92 * E); ctx.fill();
    ctx.fillStyle = '#fff3c4'; ARC.rrect(ctx, mx - 52 * E, topo + 10 * E, 104 * E, 26 * E, 5 * E); ctx.fill();   // placa
    ctx.strokeStyle = '#7d2f22'; ctx.lineWidth = 3 * E; ctx.stroke();
    ctx.fillStyle = '#7d2f22'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold ' + Math.round(17 * E) + 'px "Trebuchet MS", sans-serif'; ctx.fillText('ESCOLA', mx, topo + 23 * E);
    var jw = 26 * E, jh = 30 * E, cols = Math.max(2, Math.floor((w - 70 * E) / (jw + 14 * E)));   // janelas acesas
    for (j = 0; j < 2; j++) for (i = 0; i < cols; i++){
      var wx = x0 + 14 * E + i * (jw + 14 * E), wy = topo + 50 * E + j * (jh + 26 * E);
      ctx.fillStyle = '#f5f0e1'; ctx.fillRect(wx - 3 * E, wy - 3 * E, jw + 6 * E, jh + 6 * E);
      ctx.fillStyle = (i + j) % 3 ? '#ffe48a' : '#ffd166'; ctx.fillRect(wx, wy, jw, jh);
      ctx.fillStyle = '#c9b07a'; ctx.fillRect(wx + jw / 2 - E, wy, 2 * E, jh); ctx.fillRect(wx, wy + jh / 2 - E, jw, 2 * E);
    }
    ctx.fillStyle = '#5b3a1e'; ARC.rrect(ctx, x1 - 48 * E, base - 78 * E, 38 * E, 78 * E, 6 * E); ctx.fill();   // porta (do lado dos zumbis)
    ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(x1 - 18 * E, base - 38 * E, 3 * E, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#9aa0a6'; ctx.fillRect(x1 - 56 * E, base - 6 * E, 56 * E, 6 * E); ctx.fillStyle = '#b8bec4'; ctx.fillRect(x1 - 52 * E, base - 12 * E, 46 * E, 6 * E);   // escada
  }
  function desenhar(){
    var W = tela.W, H = tela.H, E = tela.ESC, g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1440'); g.addColorStop(0.7, '#3d2c6b'); g.addColorStop(1, '#2b2147'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.7)'; for (var st = 0; st < 30; st++) ctx.fillRect((st * 137) % W, (st * 71) % (H * 0.5), 2 * E, 2 * E);
    ctx.fillStyle = '#fff6c9'; ctx.beginPath(); ctx.arc(W * 0.82, H * 0.16, 44 * E, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#2f5d34'; ctx.fillRect(0, H - 120 * E, W, 120 * E);
    ctx.fillStyle = '#27502c'; for (var gx = 0; gx < W; gx += 18 * E) ctx.fillRect(gx, H - 120 * E, 9 * E, 6 * E);
    ctx.fillStyle = '#6b6f76'; ctx.fillRect(0, H - 40 * E, W, 40 * E); ctx.fillStyle = '#80858c'; for (var cx2 = 0; cx2 < W; cx2 += 60 * E) ctx.fillRect(cx2, H - 40 * E, 2 * E, 40 * E);   // calçada
    var tx = jogo && jogo.tremer > 0 ? Math.sin(Date.now() / 25) * 6 : 0, cx = casaX() + tx, base = H - 120 * E;
    desenharEscola(cx, base, E);
    if (!jogo || !jogo.zumbis) return;
    jogo.zumbis.forEach(function(z){
      var x = z.x, y = z.y, s = E, a = z.curado ? Math.max(0, 1 - z.tempoCura) : 1, px = 5 * s, pe = y + 80 * s;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse ? ctx.ellipse(x, pe, 30 * s, 7 * s, 0, 0, 2 * Math.PI) : ctx.arc(x, pe, 20 * s, 0, 2 * Math.PI); ctx.fill();
      if (z.curado) desenharSprite(z.crianca || 'c', x, pe - Math.abs(Math.sin(z.tempoCura * 9)) * 26 * s, px);
      else desenharSprite(Math.floor(z.passo) % 2 ? 'b' : 'a', x, pe + (Math.floor(z.passo) % 2 ? -px : 0), px);
      var txt = z.curado ? z.it.correta : z.it.errada, tam = ARC.fonte(ctx, txt, 220 * s, Math.round(26 * s)), w = ctx.measureText(txt).width + 22 * s;
      ctx.fillStyle = z.curado ? '#e3f7ee' : '#fff3d6'; ARC.rrect(ctx, x - w / 2, y - 92 * s, w, tam + 16 * s, 8 * s); ctx.fill();
      ctx.strokeStyle = '#7a5a2b'; ctx.lineWidth = 3 * s; ctx.stroke();
      ctx.fillStyle = z.curado ? '#11613a' : '#b02a37'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y - 92 * s + (tam + 16 * s) / 2);
      if (!z.curado && z === jogo.frente){ ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 4 * s; ctx.beginPath(); ctx.arc(x, y + 20 * s, 72 * s, 0, 2 * Math.PI); ctx.stroke(); }
      ctx.globalAlpha = 1;
    });
    jogo.fx.forEach(function(f){ ctx.globalAlpha = Math.max(0, 1 - f.t / 1.3); ARC.fonte(ctx, f.txt, 400, Math.round(30 * E)); ctx.fillStyle = f.cor; ctx.textAlign = 'center'; ctx.fillText(f.txt, f.x, f.y - f.t * 50); ctx.globalAlpha = 1; });
  }
  document.addEventListener('keydown', function(e){
    if (!jogo || !laco.rodando) return;
    if (e.keyCode >= 49 && e.keyCode <= 52){ e.preventDefault(); responder(e.keyCode - 49); }
    else if (e.keyCode === 32){ e.preventDefault(); $('btPausa').onclick(); }
  });
  $('btPausa').onclick = function(){ laco.pausado = !laco.pausado; this.textContent = laco.pausado ? '▶️' : '⏸️'; if (laco.pausado) ARC.aviso('⏸️ Pausado', 100000); else $('aviso').style.display = 'none'; };
  $('btComecar').onclick = comecar;
  if (window.Sala) Sala.botaoSom($('btSom'));
  desenhar();
  window.ZUMBIS = {jogo: function(){ return jogo; }, responder: responder, novo: novoZumbi};   // usado nos testes
})();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zumbis da Ortografia</title>
<link rel="stylesheet" href="arcade.css">
<style>
  #painel{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(20,16,40,.88);padding:8px 10px 10px;text-align:center;display:none}
  #frase{color:#fff;font-size:20px;margin:2px 0 6px}
  #frase mark{background:#ff6b6b;color:#fff;border-radius:6px;padding:0 6px}
  #ops button{font-size:24px;min-width:150px;margin:4px 6px}
</style>
<script src="visual.js"></script>
<script src="sala.js"></script>
<script src="arcade.js"></script>
</head>
<body>
<canvas id="cv" class="palcoJogo"></canvas>
<div id="hud" style="display:none">
  <span class="chip" id="hVez"></span><span class="chip" id="hOnda"></span><span class="chip" id="hVidas"></span><span class="chip" id="hPontos"></span>
  <button type="button" id="btPausa">⏸️</button><button type="button" id="btSom">🔊</button>
</div>
<div id="painel"><div id="frase"></div><div id="ops"></div></div>
<div id="aviso"></div>
<div class="tela ativa" id="tConfig"><div class="cartao">
  <h1>💀 Zumbis da Ortografia</h1>
  <p>Zumbis vêm andando até a casa com <b>palavras escritas errado</b>. Para curar o zumbi da frente, escolha a <b>escrita certa</b>! Se um zumbi chegar à casa, vocês perdem um coração.</p>
  <label>Palavras: <select id="selArquivo" style="max-width:560px"></select></label>
  <p class="dica" id="infoArq">Carregando…</p>
  <label>Zumbis por onda: <select id="selQtd"><option>6</option><option selected>8</option><option>12</option></select></label>
  <label>Velocidade: <select id="selVel"><option value="0.75">devagar</option><option value="1" selected>normal</option><option value="1.35">rápida</option></select></label>
  <label>Equipes: <select id="selEquipes"><option value="1">1 (turma toda)</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label>
  <p><button type="button" class="principal" id="btComecar">▶️ Começar</button></p>
  <p class="dica">Clique na resposta ou use as teclas 1, 2, 3 e 4.</p>
</div></div>
<div class="tela" id="tVez"><div class="cartao" id="cVez"></div></div>
<div class="tela" id="tFim"><div class="cartao" id="cFim"></div></div>
<script>
(function(){
  'use strict';
  var $ = ARC.$, esc = ARC.esc, itens = [], jogo = null, laco = ARC.laco(passo), tela = ARC.canvas($('cv'), function(){ if (!laco.rodando) desenhar(); }), ctx = tela.ctx;

  ARC.seletor($('selArquivo'), 'detetive', 'detetive-padrao.json', function(arq){
    $('infoArq').textContent = 'Carregando…'; itens = [];
    ARC.json('dados/' + arq, function(d){
      (d.frases || []).forEach(function(f){
        if (!f || !f.errada || !f.correta) return;
        var ops = [String(f.correta)];
        (f.opcoes || []).forEach(function(o){ o = String(o); if (ops.indexOf(o) < 0 && o !== f.errada) ops.push(o); });
        if (ops.length < 2) ops.push(String(f.errada));
        itens.push({frase: String(f.frase || ''), errada: String(f.errada), correta: String(f.correta), ops: ops.slice(0, 4)});
      });
      $('infoArq').textContent = itens.length ? (d.titulo || arq) + ' • ' + itens.length + ' palavras' : 'Este arquivo não tem palavras para corrigir.';
    }, function(){ $('infoArq').textContent = 'Não consegui abrir dados/' + arq; });
  });

  function comecar(){
    if (itens.length < 3) return ARC.aviso('Escolha um arquivo de palavras.');
    jogo = {monte: ARC.embaralhar(itens), usadas: 0, equipes: ARC.criarEquipes(+$('selEquipes').value), vez: 0, qtd: +$('selQtd').value, velBase: +$('selVel').value, onda: 1};
    abrirVez();
  }
  function abrirVez(){
    var eq = jogo.equipes[jogo.vez];
    $('cVez').innerHTML = '<h2>🌙 Onda ' + jogo.onda + (jogo.equipes.length > 1 ? ': vez dos ' + eq.emoji + ' ' + esc(eq.nome) : '') + '</h2>' +
      '<p>Vêm aí ' + jogo.qtd + ' zumbis. Protejam a casa: vocês têm 3 corações!</p>' +
      (jogo.equipes.length > 1 ? '<div class="placar">' + ARC.placarHTML(jogo.equipes, jogo.vez) + '</div>' : '') +
      '<button type="button" class="principal" id="btIr">💀 Que venham!</button>';
    ARC.tela('tVez'); $('btIr').onclick = iniciarOnda;
  }
  function iniciarOnda(){
    jogo.zumbis = []; jogo.fx = []; jogo.vidas = 3; jogo.criados = 0; jogo.curados = 0; jogo.escaparam = 0; jogo.gerar = 0.3; jogo.tremer = 0; jogo.acabou = false; jogo.frente = undefined;
    ARC.tela(null); $('hud').style.display = ''; $('painel').style.display = 'block'; atualizarHud(); laco.pausado = false; laco.iniciar();
  }
  function atualizarHud(){
    var eq = jogo.equipes[jogo.vez];
    $('hVez').textContent = jogo.equipes.length > 1 ? eq.emoji + ' ' + eq.nome : '🏠 Casa';
    $('hOnda').textContent = '💀 ' + jogo.curados + '/' + jogo.qtd + ' curados';
    $('hVidas').textContent = '❤️❤️❤️'.slice(0, jogo.vidas * 2) + '♡♡♡'.slice(0, 3 - jogo.vidas);
    $('hPontos').textContent = '⭐ ' + eq.pontos;
  }
  function casaX(){ return 150 * tela.ESC; }
  function novoZumbi(){
    if (jogo.usadas >= jogo.monte.length){ jogo.monte = ARC.embaralhar(jogo.monte); jogo.usadas = 0; }
    var it = jogo.monte[jogo.usadas++], E = tela.ESC, acel = 1 + jogo.criados * 0.06;
    jogo.zumbis.push({it: it, x: tela.W + 40 * E, y: tela.H - 170 * E - (jogo.criados % 3) * 18 * E, v: (26 + Math.random() * 10) * E * jogo.velBase * acel, passo: Math.random() * 6, ops: ARC.embaralhar(it.ops)});
    jogo.criados++;
  }
  function frente(){ var f = null; jogo.zumbis.forEach(function(z){ if (!z.curado && (!f || z.x < f.x)) f = z; }); return f; }
  function mostrarPainel(){   // jogo.frente = undefined força redesenhar o painel
    var f = frente();
    if (f === jogo.frente) return;
    jogo.frente = f;
    if (!f){ $('frase').innerHTML = jogo.criados < jogo.qtd ? 'Lá vem mais um…' : ''; $('ops').innerHTML = ''; return; }
    var fr = esc(f.it.frase).replace(esc(f.it.errada), '<mark>' + esc(f.it.errada) + '</mark>');
    $('frase').innerHTML = (f.it.frase ? fr : '<mark>' + esc(f.it.errada) + '</mark>') + ' &nbsp;→ como se escreve?';
    $('ops').innerHTML = f.ops.map(function(o, i){ return '<button type="button" data-i="' + i + '">' + (i + 1) + ') ' + esc(o) + '</button>'; }).join('');
    var bs = $('ops').querySelectorAll('button');
    for (var k = 0; k < bs.length; k++) bs[k].onclick = function(){ responder(+this.getAttribute('data-i')); };
  }
  function responder(i){
    var f = jogo.frente; if (!f || jogo.acabou || laco.pausado) return;
    var eq = jogo.equipes[jogo.vez];
    if (f.ops[i] === f.it.correta){
      f.curado = true; f.tempoCura = 0; jogo.curados++;
      var bonus = f.x > tela.W * 0.6 ? 5 : 0; eq.pontos += 10 + bonus; ARC.plim();
      jogo.fx.push({x: f.x, y: f.y - 60 * tela.ESC, t: 0, txt: '✓ ' + f.it.correta + (bonus ? ' +15' : ' +10'), cor: '#1f9d6b'});
      atualizarHud(); jogo.frente = undefined; mostrarPainel();
      if (jogo.curados + jogo.escaparam >= jogo.qtd) fimDaOnda();
    } else {
      f.v *= 1.4; ARC.erro();
      ARC.aviso('❌ “' + esc(f.ops[i]) + '” também está errado! O zumbi ficou mais rápido!', 1600);
      var b = $('ops').querySelector('[data-i="' + i + '"]'); if (b){ b.disabled = true; b.style.opacity = 0.4; }
    }
  }
  function passo(dt){
    if (dt && jogo && !jogo.acabou){
      jogo.gerar -= dt;
      if (jogo.gerar <= 0 && jogo.criados < jogo.qtd){ novoZumbi(); jogo.gerar = ARC.aleat(3.2, 4.6) / jogo.velBase; }
      for (var i = jogo.zumbis.length - 1; i >= 0; i--){
        var z = jogo.zumbis[i];
        if (z.curado){ z.tempoCura += dt; if (z.tempoCura > 1.2) jogo.zumbis.splice(i, 1); continue; }
        z.x -= z.v * dt; z.passo += dt * 4;
        if (z.x < casaX() + 40 * tela.ESC){
          jogo.zumbis.splice(i, 1); jogo.vidas--; jogo.tremer = 0.6; jogo.escaparam++; ARC.tom(140, 0.5, 0, 'sawtooth');
          ARC.aviso('🏠 Um zumbi entrou! A escrita certa era: <b>' + esc(z.it.correta) + '</b>', 2600);
          jogo.frente = undefined; atualizarHud();
          if (jogo.vidas <= 0 || jogo.curados + jogo.escaparam >= jogo.qtd){ fimDaOnda(); break; }
        }
      }
      if (jogo.tremer > 0) jogo.tremer -= dt;
      for (var k = jogo.fx.length - 1; k >= 0; k--){ jogo.fx[k].t += dt; if (jogo.fx[k].t > 1.3) jogo.fx.splice(k, 1); }
      mostrarPainel();
    }
    desenhar();
  }
  function fimDaOnda(){
    jogo.acabou = true;
    setTimeout(function(){
      laco.parar(); $('hud').style.display = 'none'; $('painel').style.display = 'none';
      var ultima = jogo.vez === jogo.equipes.length - 1;
      $('cVez').innerHTML = '<h2>' + (jogo.vidas > 0 ? '🌅 A casa está salva!' : '💀 Os zumbis venceram desta vez!') + '</h2>' +
        '<div class="placar">' + ARC.placarHTML(jogo.equipes, jogo.vez) + '</div>' +
        '<button type="button" class="principal" id="btSegue">' + (ultima ? '🏆 Resultado' : '➡️ Próxima equipe') + '</button>' + (ultima ? ' <button type="button" id="btMais">🔁 Mais uma onda</button>' : '');
      ARC.tela('tVez'); if (jogo.vidas > 0) ARC.festa();
      $('btSegue').onclick = function(){ if (ultima) fim(); else { jogo.vez++; abrirVez(); } };
      if ($('btMais')) $('btMais').onclick = function(){ jogo.vez = 0; jogo.onda++; jogo.velBase *= 1.15; abrirVez(); };
    }, 800);
  }
  function fim(){
    var r = ARC.ranking(jogo.equipes);
    $('cFim').innerHTML = '<h1>🏆 ' + (jogo.equipes.length > 1 ? r[0].e.emoji + ' ' + esc(r[0].e.nome) + ' venceu!' : jogo.equipes[0].pontos + ' pontos!') + '</h1>' +
      '<div class="placar">' + ARC.placarHTML(r.map(function(x){ return x.e; })) + '</div><button type="button" class="principal" id="btDeNovo">🔁 Jogar de novo</button>';
    ARC.tela('tFim'); ARC.festa(); $('btDeNovo').onclick = function(){ ARC.tela('tConfig'); };
  }
  function desenhar(){
    var W = tela.W, H = tela.H, E = tela.ESC, g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1440'); g.addColorStop(0.7, '#3d2c6b'); g.addColorStop(1, '#2b2147'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff6c9'; ctx.beginPath(); ctx.arc(W * 0.82, H * 0.16, 44 * E, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#2f5d34'; ctx.fillRect(0, H - 120 * E, W, 120 * E);
    var tx = jogo && jogo.tremer > 0 ? Math.sin(Date.now() / 25) * 6 : 0, cx = casaX() + tx, base = H - 120 * E;
    ctx.fillStyle = '#c0703b'; ctx.fillRect(cx - 110 * E, base - 150 * E, 150 * E, 150 * E);
    ctx.fillStyle = '#8b3a2b'; ctx.beginPath(); ctx.moveTo(cx - 125 * E, base - 150 * E); ctx.lineTo(cx - 35 * E, base - 230 * E); ctx.lineTo(cx + 55 * E, base - 150 * E); ctx.fill();
    ctx.fillStyle = '#5b3a1e'; ctx.fillRect(cx - 20 * E, base - 80 * E, 40 * E, 80 * E);
    ctx.fillStyle = '#ffe48a'; ctx.fillRect(cx - 90 * E, base - 120 * E, 40 * E, 34 * E);
    if (!jogo || !jogo.zumbis) return;
    jogo.zumbis.forEach(function(z){
      var x = z.x, y = z.y, s = E, b = Math.sin(z.passo) * 4 * s, a = z.curado ? Math.max(0, 1 - z.tempoCura) : 1;
      ctx.globalAlpha = a;
      ctx.strokeStyle = z.curado ? '#7bd389' : '#5f8f4e'; ctx.lineWidth = 9 * s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y + 40 * s); ctx.lineTo(x - 10 * s + b, y + 80 * s); ctx.moveTo(x, y + 40 * s); ctx.lineTo(x + 10 * s - b, y + 80 * s); ctx.stroke();
      ctx.fillStyle = z.curado ? '#7bd389' : '#6fa35c'; ARC.rrect(ctx, x - 18 * s, y - 10 * s, 36 * s, 54 * s, 10 * s); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 14 * s, y + 4 * s); ctx.lineTo(x - 44 * s, y + 2 * s + b); ctx.stroke();
      ctx.fillStyle = z.curado ? '#a8e6b0' : '#8fbf6a'; ctx.beginPath(); ctx.arc(x, y - 26 * s, 20 * s, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.arc(x - 8 * s, y - 29 * s, 3.5 * s, 0, 2 * Math.PI); ctx.arc(x + 4 * s, y - 29 * s, 3.5 * s, 0, 2 * Math.PI); ctx.fill();
      ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 2.5 * s; ctx.beginPath();
      if (z.curado) ctx.arc(x - 2 * s, y - 20 * s, 7 * s, 0.2, Math.PI - 0.2); else { ctx.moveTo(x - 9 * s, y - 16 * s); ctx.lineTo(x + 6 * s, y - 18 * s); }
      ctx.stroke();
      var txt = z.curado ? z.it.correta : z.it.errada, tam = ARC.fonte(ctx, txt, 220 * s, Math.round(26 * s)), w = ctx.measureText(txt).width + 22 * s;
      ctx.fillStyle = z.curado ? '#e3f7ee' : '#fff3d6'; ARC.rrect(ctx, x - w / 2, y - 92 * s, w, tam + 16 * s, 8 * s); ctx.fill();
      ctx.strokeStyle = '#7a5a2b'; ctx.lineWidth = 3 * s; ctx.stroke();
      ctx.fillStyle = z.curado ? '#11613a' : '#b02a37'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y - 92 * s + (tam + 16 * s) / 2);
      if (!z.curado && z === jogo.frente){ ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 4 * s; ctx.beginPath(); ctx.arc(x, y + 20 * s, 64 * s, 0, 2 * Math.PI); ctx.stroke(); }
      ctx.globalAlpha = 1;
    });
    jogo.fx.forEach(function(f){ ctx.globalAlpha = Math.max(0, 1 - f.t / 1.3); ARC.fonte(ctx, f.txt, 400, Math.round(30 * E)); ctx.fillStyle = f.cor; ctx.textAlign = 'center'; ctx.fillText(f.txt, f.x, f.y - f.t * 50); ctx.globalAlpha = 1; });
  }
  document.addEventListener('keydown', function(e){
    if (!jogo || !laco.rodando) return;
    if (e.keyCode >= 49 && e.keyCode <= 52){ e.preventDefault(); responder(e.keyCode - 49); }
    else if (e.keyCode === 32){ e.preventDefault(); $('btPausa').onclick(); }
  });
  $('btPausa').onclick = function(){ laco.pausado = !laco.pausado; this.textContent = laco.pausado ? '▶️' : '⏸️'; if (laco.pausado) ARC.aviso('⏸️ Pausado', 100000); else $('aviso').style.display = 'none'; };
  $('btComecar').onclick = comecar;
  if (window.Sala) Sala.botaoSom($('btSom'));
  desenhar();
  window.ZUMBIS = {jogo: function(){ return jogo; }, responder: responder, novo: novoZumbi};   // usado nos testes
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - Eduardo</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            overflow: hidden; 
            color: #f8fafc; 
        }

        /* Menu Flutuante (Ocupa o mínimo de espaço) */
        #floating-menu {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 2000;
            border: 1px solid rgba(255,255,255,0.2);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #floating-menu label { 
            font-size: 14px; 
            font-weight: bold; 
            color: #cbd5e1; 
        }

        select {
            padding: 5px 10px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer;
            background: #3b82f6; 
            color: white; 
            border: none;
            outline: none; 
        }

        .close-btn {
            background: #ef476f;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Botão para mostrar o menu novamente (Escondido no canto superior esquerdo) */
        #show-menu-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 2001;
            font-size: 16px;
            display: none; /* Só aparece quando o menu principal some */
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        /* Tela de Boas-vindas */
        #welcome-screen {
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 20px;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px;
            padding: 50px; 
            max-width: 600px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .welcome-card h1 { color: #60a5fa; margin-bottom: 15px; }
        .welcome-card p { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 25px; }

        /* Iframe ocupa a tela toda */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw; 
            height: 100vh; 
            border: none; 
            background-color: transparent; 
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <button id="show-menu-btn" onclick="toggleMenu()" title="Trocar Ferramenta">⚙️</button>

    <div id="floating-menu">
        <label>Painel:</label>
        <select id="tool-selector" onchange="changeTool()">
            <option value="">🏠 Início</option>
            <option value="ruido.html">🔊 Ruído</option>
            <option value="quiz.html">🎮 Português</option>
        </select>
        <button class="close-btn" onclick="toggleMenu()" title="Esconder Menu">X</button>
    </div>

    <div id="welcome-screen">
        <div class="welcome-card">
            <h1>Olá, Professor! 👋</h1>
            <p>Selecione a atividade no menu superior flutuante. Você pode fechá-lo para limpar a tela e reabri-lo na engrenagem no canto superior esquerdo.</p>
        </div>
    </div>

    <iframe id="app-frame" src=""></iframe>

    <script>
        function changeTool() {
            const selector = document.getElementById('tool-selector');
            const iframe = document.getElementById('app-frame');
            const welcome = document.getElementById('welcome-screen');
            
            if (selector.value === "") {
                iframe.style.display = "none";
                iframe.src = "";
                welcome.style.display = "flex";
            } else {
                welcome.style.display = "none";
                iframe.style.display = "block";
                iframe.src = selector.value;
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('floating-menu');
            const showBtn = document.getElementById('show-menu-btn');

            if (menu.style.display === 'none') {
                menu.style.display = 'flex';
                showBtn.style.display = 'none';
            } else {
                menu.style.display = 'none';
                showBtn.style.display = 'flex';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - Eduardo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #0f172a; /* Fundo escuro neutro */
            overflow: hidden;
        }

        /* Barra de Navegação no Topo */
        #top-bar {
            background: #1e293b;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        #top-bar label {
            color: #f8fafc;
            font-size: 16px;
            font-weight: bold;
        }

        select {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            border: 2px solid #60a5fa;
            outline: none;
        }

        select:hover {
            background: #2563eb;
        }

        /* A "janela" que vai carregar os outros sites */
        iframe {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: white; /* Cor de fundo caso demore a carregar */
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <label>Selecione a Ferramenta:</label>
        <select id="tool-selector" onchange="changeTool()">
            <option value="ruido.html">🔊 Medidor de Ruído (Monstro/Capivara)</option>
            <option value="quiz.html">🎮 Jogo de Português (Prof. Eduardo)</option>
        </select>
    </div>

    <iframe id="app-frame" src="ruido.html"></iframe>

    <script>
        // Função que troca o site dentro do iframe baseado na seleção
        function changeTool() {
            const selector = document.getElementById('tool-selector');
            const iframe = document.getElementById('app-frame');
            
            // Troca o endereço do iframe para o valor selecionado
            iframe.src = selector.value;
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escada de Palavras</title>
<link rel="stylesheet" href="jogo-ao-vivo.css">
<style>
  #listaEscadas{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  #listaEscadas button{font-size:1.15rem}
  #listaEscadas button span{display:block;font-size:2rem}
  .jogo{display:flex;gap:20px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  #degraus{display:flex;flex-direction:column-reverse;gap:6px;min-width:230px;background:#fff;border-radius:22px;padding:12px;box-shadow:0 4px 0 #0001}
  .degrau{display:flex;align-items:center;gap:10px;border-radius:14px;padding:6px 12px;font-size:1.3rem;font-weight:bold;background:#f1f3f7;color:#9aa3b5;border-left:10px solid #d5dbe6}
  .degrau .e{font-size:1.8rem;width:44px;text-align:center}
  .degrau.feito{background:#eaf7ee;color:#243049;border-left-color:#27ae60}
  .degrau.agora{background:#fff6cc;color:#243049;border-left-color:#ffd54a;transform:scale(1.04)}
  .principalArea{flex:1;min-width:320px;max-width:820px;text-align:center}
  #alvo{font-size:clamp(5rem,13vw,9rem);line-height:1.1}
  #instrucao{font-size:clamp(1.2rem,2.8vw,1.8rem);font-weight:bold;margin:6px 0}
  #letras{display:flex;gap:10px;justify-content:center;margin:14px 0}
  .tile{width:clamp(70px,11vw,120px);height:clamp(84px,13vw,140px);font-size:clamp(2.6rem,7vw,5rem);font-weight:bold;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
  .tile.escolhida{background:#ffd54a}
  .tile.dica{animation:pulsa 1s infinite}
  .tile.nova{background:#27ae60;color:#fff}
  @keyframes pulsa{50%{transform:scale(1.1);box-shadow:0 0 0 6px #ffd54a}}
  .tremer{animation:tremer .4s}
  @keyframes tremer{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  #opcoesLetra{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:10px}
  #opcoesLetra button{font-size:clamp(2.2rem,6vw,4rem);min-width:100px;background:#2f80ed;color:#fff}
  #msg{font-size:clamp(1.1rem,2.4vw,1.5rem);min-height:1.5em;margin:10px 0}
</style>
<script src="visual.js"></script>
</head>
<body>
<section id="tConfig" class="tela ativa">
  <h1>🪜 Escada de Palavras</h1>
  <p class="dica" style="text-align:center;max-width:760px">Em cada degrau, a turma troca <b>uma letra só</b> para formar a palavra da figura: GATO → PATO → MATO…</p>
  <div class="cartao">
    <h2>1. Escadas (JSON)</h2>
    <label>Arquivo: <select id="selArquivo"></select></label>
    <div class="linha" style="justify-content:flex-start">
      <button id="btnAbrirJson">📂 Abrir outro JSON do computador</button>
      <button id="btnModelo">📄 Baixar o modelo</button>
    </div>
    <input type="file" id="arquivoJson" accept=".json,application/json" hidden>
    <div id="infoJson" class="dica"></div>
  </div>
  <div class="cartao">
    <h2>2. Escolha a escada</h2>
    <div id="listaEscadas"></div>
    <label><input type="checkbox" id="chkFacil"> Modo fácil: a letra que deve ser trocada pisca</label>
    <label><input type="checkbox" id="chkMinuscula"> Mostrar em letra minúscula</label>
  </div>
</section>

<section id="tJogo" class="tela">
  <div class="jogo">
    <div id="degraus"></div>
    <div class="principalArea">
      <div id="instrucao"></div>
      <div id="alvo"></div>
      <div id="letras"></div>
      <div id="opcoesLetra"></div>
      <div id="msg"></div>
      <div class="linha">
        <button id="btnOuvir">🔊 Ouvir</button>
        <button id="btnProxima" class="principal" hidden>⬆️ Subir</button>
        <button id="btnVoltar">🔁 Outra escada</button>
      </div>
    </div>
  </div>
</section>

<script src="jogo-ao-vivo.js"></script>
<script>
const $ = id => document.getElementById(id);
const AV = window.AoVivo;
const LETRAS = 'ABCDEFGHIJLMNOPRSTUVXZ'.split('');
let dados = null, esc = null, passo = 0, posEscolhida = -1, errosPos = 0;

function normalizar(d){
  if (!d || !Array.isArray(d.escadas)) return null;
  const escadas = d.escadas.map(e => {
    const passos = (e.passos || []).map(p => ({p: String(p.p || p.palavra || '').toUpperCase(), e: p.e || p.emoji || ''})).filter(p => p.p);
    const ok = passos.length >= 2 && passos.every((p, i) => i === 0 || (p.p.length === passos[i - 1].p.length && [...p.p].filter((c, k) => c !== passos[i - 1].p[k]).length === 1));
    return ok ? {nome: e.nome || passos[0].p + ' → ' + passos[passos.length - 1].p, passos} : null;
  }).filter(Boolean);
  return escadas.length ? {titulo: d.titulo || 'Escadas de palavras', escadas, ignoradas: d.escadas.length - escadas.length} : null;
}
function carregar(d, origem){
  const x = normalizar(d);
  if (!x) return AV.avisar('JSON inválido: cada degrau precisa trocar exatamente uma letra do degrau anterior.');
  dados = x;
  $('infoJson').textContent = `${x.titulo} • ${x.escadas.length} escadas` + (x.ignoradas ? ` • ⚠️ ${x.ignoradas} ignorada(s): algum degrau troca mais de uma letra` : '') + (origem ? ` • ${origem}` : '');
  $('listaEscadas').innerHTML = x.escadas.map((e, i) => `<button data-i="${i}"><span>${e.passos[0].e} ➜ ${e.passos[e.passos.length - 1].e}</span>${AV.esc(e.nome)} (${e.passos.length - 1} degraus)</button>`).join('');
  $('listaEscadas').querySelectorAll('button').forEach(b => b.onclick = () => iniciar(x.escadas[+b.dataset.i]));
}
AV.prepararSeletorJson({tipo: 'escada', select: $('selArquivo'), botaoAbrir: $('btnAbrirJson'), input: $('arquivoJson'), aoCarregar: carregar});
$('btnModelo').onclick = () => AV.baixarArquivo('dados/escada-palavras.json', 'modelo-escada-de-palavras.json');

const caixa = t => $('chkMinuscula').checked ? t.toLowerCase() : t;
function iniciar(e){ esc = e; passo = 0; AV.mostrarTela('tJogo'); rodada(); }
function desenharDegraus(){
  $('degraus').innerHTML = esc.passos.map((p, i) => {
    const cls = i <= passo ? 'feito' : i === passo + 1 ? 'agora' : '';
    const txt = i <= passo ? caixa(p.p) : i === passo + 1 ? '?' : '…';
    return `<div class="degrau ${cls}"><span class="e">${i <= passo + 1 ? p.e : ''}</span>${AV.esc(txt)}</div>`;
  }).join('');
}
function diferenca(a, b){ for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return i; return -1; }
function rodada(){
  desenharDegraus();
  $('opcoesLetra').innerHTML = ''; $('btnProxima').hidden = true; posEscolhida = -1; errosPos = 0;
  if (passo >= esc.passos.length - 1){
    $('instrucao').textContent = '🏆 Vocês chegaram ao topo da escada!';
    $('alvo').textContent = esc.passos.map(p => p.e).join(' ');
    $('alvo').style.fontSize = 'clamp(2rem,6vw,4rem)';
    $('letras').innerHTML = ''; $('msg').textContent = esc.passos.map(p => caixa(p.p)).join(' → ');
    AV.fanfarra(); AV.confete();
    return;
  }
  $('alvo').style.fontSize = '';
  const atual = esc.passos[passo], prox = esc.passos[passo + 1];
  $('instrucao').innerHTML = `Troque <u>uma letra</u> de <b>${AV.esc(caixa(atual.p))}</b> para formar:`;
  $('alvo').textContent = prox.e;
  $('letras').innerHTML = [...atual.p].map((c, i) => `<button class="tile" data-i="${i}">${AV.esc(caixa(c))}</button>`).join('');
  const certa = diferenca(atual.p, prox.p);
  if ($('chkFacil').checked) $('letras').children[certa].classList.add('dica');
  $('letras').querySelectorAll('.tile').forEach(b => b.onclick = () => escolherPosicao(+b.dataset.i, b, certa));
  $('msg').textContent = '👆 Toquem na letra que vai mudar.';
  AV.falar(`Troque uma letra de ${atual.p.toLowerCase()} para formar o nome desta figura.`);
}
function escolherPosicao(i, b, certa){
  if (posEscolhida >= 0) return;
  if (i !== certa){
    errosPos++; b.classList.add('tremer'); setTimeout(() => b.classList.remove('tremer'), 400); AV.erro();
    $('msg').textContent = errosPos >= 2 ? '💡 Dica: falem as duas palavras bem devagar e vejam qual som muda.' : '🤔 Essa letra continua igual. Tentem outra!';
    if (errosPos >= 3) $('letras').children[certa].classList.add('dica');
    return;
  }
  posEscolhida = i; b.classList.remove('dica'); b.classList.add('escolhida'); AV.tom(700, .1);
  const prox = esc.passos[passo + 1], nova = prox.p[i], velha = esc.passos[passo].p[i];
  const outras = LETRAS.concat(/[ÃÕÊÔÉÁÍÓÚ]/.test(nova) ? [nova] : []).filter(c => c !== nova && c !== velha).sort(() => Math.random() - .5).slice(0, 3);
  const ops = [nova, ...outras].sort(() => Math.random() - .5);
  $('opcoesLetra').innerHTML = ops.map(c => `<button data-c="${c}">${AV.esc(caixa(c))}</button>`).join('');
  $('opcoesLetra').querySelectorAll('button').forEach(o => o.onclick = () => escolherLetra(o, nova));
  $('msg').textContent = '🔤 Agora escolham a letra nova.';
}
function escolherLetra(o, nova){
  if (o.dataset.c !== nova){
    o.disabled = true; AV.erro();
    const palavra = [...esc.passos[passo].p]; palavra[posEscolhida] = o.dataset.c;
    $('msg').textContent = `🤔 Ficaria "${caixa(palavra.join(''))}". Não é o nome da figura. Tentem outra letra!`;
    return;
  }
  const tile = $('letras').children[posEscolhida];
  tile.textContent = caixa(nova); tile.classList.remove('escolhida'); tile.classList.add('nova');
  $('opcoesLetra').innerHTML = '';
  const prox = esc.passos[passo + 1];
  $('msg').textContent = `✅ ${caixa(esc.passos[passo].p)} → ${caixa(prox.p)} ${prox.e}`;
  AV.fanfarra(); AV.falar(prox.p.toLowerCase());
  $('btnProxima').hidden = false;
}
$('btnProxima').onclick = () => { passo++; rodada(); };
$('btnOuvir').onclick = () => { const p = esc.passos[Math.min(passo, esc.passos.length - 1)]; AV.falar(p.p.toLowerCase()); };
$('btnVoltar').onclick = () => AV.mostrarTela('tConfig');
</script>
</body>
</html>

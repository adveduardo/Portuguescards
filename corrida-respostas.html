<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Corrida das Respostas</title>
<link rel="stylesheet" href="arcade.css">
<style>
  #pergunta{position:fixed;left:50%;top:52px;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:min(94vw,1000px);width:94vw;max-width:1000px;background:rgba(255,255,255,.96);
    border-radius:18px;padding:10px 16px;font-size:24px;font-weight:bold;text-align:center;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.25);display:none}
</style>
<script src="visual.js"></script>
<script src="sala.js"></script>
<script src="arcade.js"></script>
</head>
<body>
<canvas id="cv" class="palcoJogo"></canvas>
<div id="hud" style="display:none">
  <span class="chip" id="hVez"></span><span class="chip" id="hQ"></span><span class="chip" id="hVidas"></span><span class="chip" id="hPontos"></span>
  <button type="button" id="btPausa">⏸️</button><button type="button" id="btSom">🔊</button>
</div>
<div id="pergunta"></div>
<div class="setas" id="setas" style="display:none"><button type="button" id="btEsq" aria-label="Pista da esquerda">◀</button><button type="button" id="btDir" aria-label="Pista da direita">▶</button></div>
<div id="aviso"></div>
<div class="tela ativa" id="tConfig"><div class="cartao">
  <h1>🛤️ Corrida das Respostas</h1>
  <p>O corredor está numa estrada de 3 pistas. Aparece uma pergunta e cada pista tem um portão com uma resposta: <b>troque de pista</b> e passe pelo portão certo!</p>
  <label>Perguntas: <select id="selArquivo" style="max-width:560px"></select></label>
  <p class="dica" id="infoArq">Carregando…</p>
  <label>Perguntas por vez: <select id="selQtd"><option>5</option><option selected>8</option><option>10</option></select></label>
  <label>Tempo para pensar: <select id="selTempo"><option value="7">7 s</option><option value="10" selected>10 s</option><option value="14">14 s</option></select></label>
  <label>Equipes: <select id="selEquipes"><option value="1">1 (turma toda)</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label>
  <p><button type="button" class="principal" id="btComecar">▶️ Começar</button></p>
  <p class="dica">Setas ← → (ou A e D), os botões da tela ou tocar nos lados da tela. Moedas pelo caminho valem pontos extras!</p>
</div></div>
<div class="tela" id="tVez"><div class="cartao" id="cVez"></div></div>
<div class="tela" id="tFim"><div class="cartao" id="cFim"></div></div>
<script>
(function(){
  'use strict';
  var $ = ARC.$, esc = ARC.esc, perguntas = [], jogo = null, laco = ARC.laco(passo), tela = ARC.canvas($('cv'), function(){ if (!laco.rodando) desenhar(); }), ctx = tela.ctx;
  var CORES = ['#2f80ed', '#e8590c', '#8e44ad'];

  ARC.seletor($('selArquivo'), 'perguntas', 'banco-quiz-geral.json', function(arq){
    $('infoArq').textContent = 'Carregando…'; perguntas = [];
    ARC.json('dados/' + arq, function(d){
      perguntas = ARC.normalizarPerguntas(d, {maxOps: 3, maxLen: 170, maxOpLen: 42});
      $('infoArq').textContent = perguntas.length ? (d.titulo || arq) + ' • ' + perguntas.length + ' perguntas que cabem nos portões' : 'Este arquivo não tem perguntas curtas o bastante para os portões.';
    }, function(){ $('infoArq').textContent = 'Não consegui abrir dados/' + arq; });
  });

  function comecar(){
    if (perguntas.length < 3) return ARC.aviso('Escolha um arquivo com perguntas.');
    jogo = {monte: ARC.embaralhar(perguntas), usadas: 0, equipes: ARC.criarEquipes(+$('selEquipes').value), vez: 0, qtd: +$('selQtd').value, tempo: +$('selTempo').value};
    abrirVez();
  }
  function abrirVez(){
    var eq = jogo.equipes[jogo.vez];
    $('cVez').innerHTML = (jogo.equipes.length > 1 ? '<h2>Vez dos ' + eq.emoji + ' ' + esc(eq.nome) + '</h2>' : '<h2>Preparar…</h2>') +
      '<p>' + jogo.qtd + ' perguntas e 3 corações. Escolham alguém para ficar no controle!</p>' +
      (jogo.equipes.length > 1 ? '<div class="placar">' + ARC.placarHTML(jogo.equipes, jogo.vez) + '</div>' : '') +
      '<button type="button" class="principal" id="btIr">🏃 Correr!</button>';
    ARC.tela('tVez'); $('btIr').onclick = iniciarVez;
  }
  function iniciarVez(){
    jogo.vidas = 3; jogo.q = 0; jogo.pista = 1; jogo.xPista = 1; jogo.dist = 0; jogo.vel = 1; jogo.moedas = []; jogo.fx = []; jogo.batida = 0;
    novaPergunta();
    ARC.tela(null); $('hud').style.display = ''; $('pergunta').style.display = 'block'; if ('ontouchstart' in window) $('setas').style.display = '';
    laco.pausado = false; laco.iniciar();
  }
  function novaPergunta(){
    if (jogo.usadas >= jogo.monte.length){ jogo.monte = ARC.embaralhar(jogo.monte); jogo.usadas = 0; }
    var p = jogo.monte[jogo.usadas++], ops = p.ops.slice(), ok = p.ok;
    while (ops.length < 3) ops.push('');   // perguntas de 2 alternativas: a terceira pista fica livre
    jogo.p = {p: p.p, ops: ops, ok: ok, x: p.x};
    jogo.portao = 1;   // 1 = longe; 0 = chegou no corredor
    $('pergunta').textContent = (jogo.q + 1) + '. ' + p.p;
    // moedas entre os portões
    for (var i = 0; i < 4; i++) jogo.moedas.push({pista: Math.floor(Math.random() * 3), z: 0.95 - i * 0.18});
    atualizarHud();
  }
  function atualizarHud(){
    var eq = jogo.equipes[jogo.vez];
    $('hVez').textContent = (jogo.equipes.length > 1 ? eq.emoji + ' ' + eq.nome : '🏃 Corrida');
    $('hQ').textContent = '❓ ' + Math.min(jogo.q + 1, jogo.qtd) + '/' + jogo.qtd;
    $('hVidas').textContent = '❤️❤️❤️'.slice(0, jogo.vidas * 2) + '♡♡♡'.slice(0, 3 - jogo.vidas);
    $('hPontos').textContent = '⭐ ' + eq.pontos;
  }
  function passo(dt){
    if (dt && jogo && jogo.p){
      jogo.xPista += (jogo.pista - jogo.xPista) * Math.min(1, dt * 12);
      jogo.dist += dt * (6 + jogo.vel * 2);
      if (jogo.batida > 0) jogo.batida -= dt;
      jogo.portao -= dt / jogo.tempo;
      for (var i = jogo.moedas.length - 1; i >= 0; i--){
        var m = jogo.moedas[i]; m.z -= dt / jogo.tempo * 1.1;
        if (m.z <= 0.04){ if (m.pista === jogo.pista){ jogo.equipes[jogo.vez].pontos += 2; ARC.tom(1180, 0.06); jogo.fx.push({t: 0, txt: '+2', cor: '#e6a800'}); atualizarHud(); } jogo.moedas.splice(i, 1); }
      }
      if (jogo.portao <= 0) passarPortao();
      for (var k = jogo.fx.length - 1; k >= 0; k--){ jogo.fx[k].t += dt; if (jogo.fx[k].t > 1) jogo.fx.splice(k, 1); }
    }
    desenhar();
  }
  function passarPortao(){
    var eq = jogo.equipes[jogo.vez], certo = jogo.pista === jogo.p.ok;
    if (certo){ eq.pontos += 10; jogo.vel += 0.25; ARC.plim(); jogo.fx.push({t: 0, txt: '✓ +10', cor: '#1f9d6b'}); }
    else {
      jogo.vidas--; jogo.batida = 0.8; ARC.erro();
      ARC.aviso('💥 A resposta certa era: <b>' + esc(jogo.p.ops[jogo.p.ok]) + '</b>' + (jogo.p.x ? '<br><small>' + esc(jogo.p.x) + '</small>' : ''), 3200);
    }
    jogo.q++; atualizarHud();
    if (jogo.vidas <= 0 || jogo.q >= jogo.qtd) return fimDaVez();
    novaPergunta();
  }
  function fimDaVez(){
    jogo.p = null;
    setTimeout(function(){
      laco.parar(); $('hud').style.display = 'none'; $('pergunta').style.display = 'none'; $('setas').style.display = 'none';
      var ultima = jogo.vez === jogo.equipes.length - 1;
      $('cVez').innerHTML = '<h2>' + (jogo.vidas > 0 ? '🏁 Chegaram ao fim!' : '💔 Acabaram os corações') + '</h2>' +
        '<div class="placar">' + ARC.placarHTML(jogo.equipes, jogo.vez) + '</div>' +
        '<button type="button" class="principal" id="btSegue">' + (ultima ? '🏆 Resultado' : '➡️ Próxima equipe') + '</button>' + (ultima ? ' <button type="button" id="btMais">🔁 Mais uma rodada</button>' : '');
      ARC.tela('tVez');
      $('btSegue').onclick = function(){ if (ultima) fim(); else { jogo.vez++; abrirVez(); } };
      if ($('btMais')) $('btMais').onclick = function(){ jogo.vez = 0; abrirVez(); };
    }, 900);
  }
  function fim(){
    var r = ARC.ranking(jogo.equipes);
    $('cFim').innerHTML = '<h1>🏆 ' + (jogo.equipes.length > 1 ? r[0].e.emoji + ' ' + esc(r[0].e.nome) + ' venceu!' : jogo.equipes[0].pontos + ' pontos!') + '</h1>' +
      '<div class="placar">' + ARC.placarHTML(r.map(function(x){ return x.e; })) + '</div><button type="button" class="principal" id="btDeNovo">🔁 Jogar de novo</button>';
    ARC.tela('tFim'); ARC.festa(); $('btDeNovo').onclick = function(){ ARC.tela('tConfig'); };
  }

  // estrada em perspectiva: z = 1 (horizonte) até 0 (perto do corredor)
  function proj(pista, z){
    var W = tela.W, H = tela.H, hz = H * 0.3, base = H - 40 * tela.ESC, y = base - (base - hz) * z;
    var larg = (W * 0.86) * (1 - z) + (W * 0.12) * z, x = W / 2 + (pista - 1) * larg / 3;
    return {x: x, y: y, esc: (1 - z) * 0.85 + 0.15, larg: larg};
  }
  function desenhar(){
    var W = tela.W, H = tela.H, E = tela.ESC, hz = H * 0.3, g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#5ec8ff'); g.addColorStop(1, '#c9efff'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, hz);
    ctx.fillStyle = '#6cc04a'; ctx.fillRect(0, hz, W, H - hz);
    var a = proj(0, 1), b = proj(2, 1), c = proj(0, 0), d = proj(2, 0);
    ctx.fillStyle = '#5d6475'; ctx.beginPath(); ctx.moveTo(a.x - a.larg / 6, a.y); ctx.lineTo(b.x + b.larg / 6, b.y); ctx.lineTo(d.x + d.larg / 6, H); ctx.lineTo(c.x - c.larg / 6, H); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    for (var f = 0; f < 2; f++) for (var s = 0; s < 12; s++){
      var z1 = ((s / 12) + (jogo ? (jogo.dist * 0.08) % (1 / 12) : 0)), z2 = z1 + 0.035;
      var p1 = proj(f + 0.5, 1 - z1), p2 = proj(f + 0.5, 1 - z2); ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    if (!jogo || !jogo.p && !jogo.batida) { desenharCorredor(); return; }
    (jogo.moedas || []).forEach(function(m){ var q = proj(m.pista, m.z); ctx.fillStyle = '#ffd54a'; ctx.strokeStyle = '#c99700'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y - 14 * q.esc * E, 13 * q.esc * E, 0, 2 * Math.PI); ctx.fill(); ctx.stroke(); });
    if (jogo.p){
      var z = Math.max(0, jogo.portao);
      for (var i = 0; i < 3; i++){
        if (!jogo.p.ops[i]) continue;
        var q = proj(i, z), w = q.larg / 3 * 0.92, h = 120 * q.esc * E + 30 * E;
        ctx.fillStyle = CORES[i]; ARC.rrect(ctx, q.x - w / 2, q.y - h, w, h * 0.42, 12 * q.esc); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(q.x - w / 2, q.y - h * 0.58, 6 * q.esc, h * 0.58); ctx.fillRect(q.x + w / 2 - 6 * q.esc, q.y - h * 0.58, 6 * q.esc, h * 0.58);
        var tam = ARC.fonte(ctx, jogo.p.ops[i], w - 14, Math.max(12, Math.round(30 * q.esc * E))), linhas = ARC.linhas(ctx, jogo.p.ops[i], w - 14);
        if (linhas.length > 1){ tam = ARC.fonte(ctx, linhas.reduce(function(x, y){ return x.length > y.length ? x : y; }), w - 14, Math.max(11, Math.round(24 * q.esc * E))); }
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        linhas.slice(0, 2).forEach(function(l, k, arr){ ctx.fillText(l, q.x, q.y - h + h * 0.21 + (k - (arr.length - 1) / 2) * (tam + 2)); });
      }
    }
    desenharCorredor();
    jogo.fx.forEach(function(f){ ctx.globalAlpha = 1 - f.t; ctx.fillStyle = f.cor; ARC.fonte(ctx, f.txt, 300, Math.round(46 * E)); ctx.textAlign = 'center'; ctx.fillText(f.txt, W / 2, H * 0.62 - f.t * 60); ctx.globalAlpha = 1; });
  }
  function desenharCorredor(){
    var E = tela.ESC, q = proj(jogo ? jogo.xPista : 1, 0.02), x = q.x, y = q.y - 10 * E, t = Date.now() / 120, bat = jogo && jogo.batida > 0;
    ctx.save(); ctx.translate(x, y); if (bat) ctx.rotate(Math.sin(t * 3) * 0.3);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse ? ctx.ellipse(0, 6 * E, 26 * E, 8 * E, 0, 0, 2 * Math.PI) : ctx.arc(0, 6 * E, 20 * E, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = '#2b2550'; ctx.lineWidth = 7 * E; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -30 * E); ctx.lineTo(Math.sin(t) * 12 * E, 0); ctx.moveTo(0, -30 * E); ctx.lineTo(-Math.sin(t) * 12 * E, 0); ctx.stroke();
    ctx.fillStyle = '#ff7a1a'; ARC.rrect(ctx, -16 * E, -70 * E, 32 * E, 44 * E, 12 * E); ctx.fill();
    ctx.fillStyle = '#ffd7b0'; ctx.beginPath(); ctx.arc(0, -84 * E, 16 * E, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#2b2550'; ctx.beginPath(); ctx.arc(-5 * E, -86 * E, 2.5 * E, 0, 2 * Math.PI); ctx.arc(5 * E, -86 * E, 2.5 * E, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
  }
  function mudar(d){ if (!jogo || !jogo.p || laco.pausado) return; jogo.pista = Math.max(0, Math.min(2, jogo.pista + d)); ARC.tom(520, 0.04); }
  document.addEventListener('keydown', function(e){
    if (!jogo || !laco.rodando) return;
    if (e.keyCode === 37 || e.keyCode === 65){ e.preventDefault(); mudar(-1); }
    else if (e.keyCode === 39 || e.keyCode === 68){ e.preventDefault(); mudar(1); }
    else if (e.keyCode === 32){ e.preventDefault(); $('btPausa').onclick(); }
  });
  $('cv').addEventListener('mousedown', function(e){ mudar(e.clientX < tela.W / 2 ? -1 : 1); });
  $('cv').addEventListener('touchstart', function(e){ mudar(e.changedTouches[0].clientX < tela.W / 2 ? -1 : 1); e.preventDefault(); }, {passive: false});
  $('btEsq').onclick = function(){ mudar(-1); }; $('btDir').onclick = function(){ mudar(1); };
  $('btPausa').onclick = function(){ laco.pausado = !laco.pausado; this.textContent = laco.pausado ? '▶️' : '⏸️'; if (laco.pausado) ARC.aviso('⏸️ Pausado', 100000); else $('aviso').style.display = 'none'; };
  $('btComecar').onclick = comecar;
  if (window.Sala) Sala.botaoSom($('btSom'));
  desenhar();
  window.CORRIDA = {jogo: function(){ return jogo; }, mudar: mudar, passarPortao: passarPortao};   // usado nos testes
})();
</script>
</body>
</html>

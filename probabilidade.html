<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório de probabilidade</title>
<link rel="stylesheet" href="mat.css">
<style>
  #exps button{margin:2px}
  #palco{display:flex;align-items:center;justify-content:center;gap:18px;min-height:190px;flex-wrap:wrap}
  .moeda{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;font-size:1.2rem;color:#5d4300;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5c542 55%,#c99700);box-shadow:0 6px 0 #a17800,inset 0 0 0 8px rgba(255,255,255,.35)}
  .moeda span{font-size:3.4rem;line-height:1}
  .gira{animation:gira .7s ease-out}
  @keyframes gira{0%{transform:rotateY(0) translateY(0)}40%{transform:rotateY(900deg) translateY(-50px)}100%{transform:rotateY(1800deg) translateY(0)}}
  .pula{animation:pula .55s ease-out}
  @keyframes pula{0%{transform:rotate(0) scale(.6)}60%{transform:rotate(320deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
  #urna{display:flex;flex-wrap:wrap;gap:6px;max-width:300px;justify-content:center;padding:12px;border:4px solid #8a9bbd;border-top:none;border-radius:0 0 40px 40px;min-height:90px}
  .bola{width:34px;height:34px;border-radius:50%;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
  .bola.grande{width:90px;height:90px}
  #roda{transition:transform 2.2s cubic-bezier(.15,.75,.2,1)}
  .caixaGraf{position:relative;height:clamp(240px,36vh,380px)}
  table.freq{border-collapse:collapse;width:100%;font-size:1rem}
  table.freq th,table.freq td{border:2px solid #d6dbe8;padding:4px 6px;text-align:center}
  table.freq th{background:#eef1f6}
  #resultado{font-size:1.5rem;font-weight:bold;text-align:center;min-height:1.6em}
  #total{font-size:1.2rem;font-weight:bold}
  .config label{margin-right:10px;font-weight:bold}
  .config input{width:64px}
  #aposta{background:#fff8e1;border-radius:14px;padding:8px 12px;margin-top:8px}
</style>
<script src="visual.js"></script>
<script src="sala.js"></script>
<script src="libs/chart.umd.js"></script>
</head>
<body>
<header class="mt">
  <h1>🎲 Laboratório de probabilidade</h1>
  <span id="total" class="mt-chip">0 lançamentos</span>
  <button id="btSom">🔊</button>
</header>
<div class="mt-wrap">
  <div class="mt-card">
    <div class="mt-linha" id="exps"><button data-e="moeda" class="ativo">🪙 Moeda</button><button data-e="dado">🎲 Dado</button><button data-e="soma">🎲🎲 Soma de dois dados</button><button data-e="urna">🏺 Urna de bolinhas</button><button data-e="roleta">🎡 Roleta</button></div>
    <div class="mt-linha config" id="config" style="margin-top:8px"></div>
  </div>
  <div class="mt-colunas">
    <div class="mt-card">
      <div id="palco"></div>
      <div id="resultado"></div>
      <p class="mt-linha" style="justify-content:center">
        <button class="principal" data-n="1">▶️ Lançar 1 vez</button><button data-n="10">10 vezes</button><button data-n="100">100 vezes</button><button data-n="1000">1.000 vezes</button><button data-n="10000">10.000</button><button class="perigo" id="btZerar">🧹 Zerar</button>
      </p>
      <div id="aposta"></div>
      <h2 style="margin-top:12px">📊 O que saiu × o que a teoria prevê</h2>
      <div class="caixaGraf"><canvas id="grafBarras"></canvas></div>
    </div>
    <div>
      <div class="mt-card"><h2>Tabela</h2><table class="freq" id="tabela"></table></div>
      <div class="mt-card"><h2>📈 Quanto mais lançamentos…</h2>
        <p class="mt-linha"><label>Acompanhar: <select id="selFoco"></select></label></p>
        <div class="caixaGraf"><canvas id="grafLinha"></canvas></div>
        <p class="mt-dica">Com poucos lançamentos a frequência pula muito. Com muitos, ela se aproxima da probabilidade teórica (linha tracejada): é a <b>Lei dos Grandes Números</b>.</p></div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  Sala.botaoSom($('btSom'));
  Chart.defaults.font.size = 14; Chart.defaults.font.family = '"Trebuchet MS","Segoe UI",system-ui,sans-serif'; Chart.defaults.color = '#1f2a44';
  function n(v, c){ var m = Math.pow(10, c === undefined ? 1 : c); return String(Math.round(v * m) / m).replace('.', ','); }
  function mdc(a, b){ return b ? mdc(b, a % b) : a; }
  function fracao(a, b){ var d = mdc(a, b); return (a / d) + '/' + (b / d); }
  var CORES_URNA = [['🔴 Vermelha', '#e74c3c'], ['🔵 Azul', '#2f80ed'], ['🟢 Verde', '#27ae60'], ['🟡 Amarela', '#f1c40f']];
  var exp = 'moeda', cont = [], hist = [], total = 0, ultimo = null, urna = [3, 2, 1, 0], roleta = [4, 2, 1, 1], giroAtual = 0, aposta = null;
  // ---------- definição de cada experimento ----------
  function definicao(){
    var i, r;
    if (exp === 'moeda') return {nomes: ['😀 Cara', '👑 Coroa'], peso: [1, 1]};
    if (exp === 'dado') return {nomes: ['1', '2', '3', '4', '5', '6'], peso: [1, 1, 1, 1, 1, 1]};
    if (exp === 'soma'){ r = {nomes: [], peso: []}; for (i = 2; i <= 12; i++){ r.nomes.push(String(i)); r.peso.push(6 - Math.abs(i - 7)); } return r; }
    if (exp === 'urna'){ r = {nomes: [], peso: [], cores: []}; urna.forEach(function(k, j){ if (k > 0){ r.nomes.push(CORES_URNA[j][0]); r.peso.push(k); r.cores.push(CORES_URNA[j][1]); } }); return r; }
    r = {nomes: [], peso: [], cores: []}; roleta.forEach(function(k, j){ if (k > 0){ r.nomes.push(CORES_URNA[j][0].split(' ')[0] + ' ' + ['Vermelho', 'Azul', 'Verde', 'Amarelo'][j]); r.peso.push(k); r.cores.push(CORES_URNA[j][1]); } }); return r;
  }
  var def = definicao();
  function somaPesos(){ return def.peso.reduce(function(a, b){ return a + b; }, 0); }
  function sortear(){
    if (exp === 'soma'){ var d1 = 1 + Math.floor(Math.random() * 6), d2 = 1 + Math.floor(Math.random() * 6); return {i: d1 + d2 - 2, d: [d1, d2]}; }
    var t = Math.random() * somaPesos(), ac = 0;
    for (var i = 0; i < def.peso.length; i++){ ac += def.peso[i]; if (t < ac) return {i: i}; }
    return {i: def.peso.length - 1};
  }
  // ---------- desenhos ----------
  var PIPS = {1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]], 5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]], 6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]]};
  function dado(v){ return '<svg class="pula" width="120" height="120" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="18" fill="#fff" stroke="#1f2a44" stroke-width="4"/>' + PIPS[v].map(function(p){ return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="9" fill="' + (v === 1 ? '#e74c3c' : '#1f2a44') + '"/>'; }).join('') + '</svg>'; }
  function roda(){
    var tot = somaPesos(), a0 = 0, s = '<svg width="220" height="230" viewBox="-110 -120 220 230"><g id="roda" style="transform:rotate(' + giroAtual + 'deg)">';
    def.peso.forEach(function(p, i){
      var a1 = a0 + p / tot * 360, r = 100, x0 = r * Math.sin(a0 * Math.PI / 180), y0 = -r * Math.cos(a0 * Math.PI / 180), x1 = r * Math.sin(a1 * Math.PI / 180), y1 = -r * Math.cos(a1 * Math.PI / 180);
      s += p === tot ? '<circle r="100" fill="' + def.cores[i] + '"/>' : '<path d="M0,0 L' + x0.toFixed(2) + ',' + y0.toFixed(2) + ' A100,100 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' Z" fill="' + def.cores[i] + '" stroke="#fff" stroke-width="3"/>';
      a0 = a1;
    });
    return s + '<circle r="12" fill="#1f2a44"/></g><path d="M-14,-118 L14,-118 L0,-92 Z" fill="#1f2a44"/></svg>';
  }
  function palco(animar){
    var h = '';
    if (exp === 'moeda'){ var c = !ultimo || ultimo.i === 0; h = '<div class="moeda' + (animar ? ' gira' : '') + '"><span>' + (c ? '😀' : '👑') + '</span>' + (c ? 'CARA' : 'COROA') + '</div>'; }
    else if (exp === 'dado') h = dado(ultimo ? ultimo.i + 1 : 6);
    else if (exp === 'soma') h = dado(ultimo ? ultimo.d[0] : 3) + '<b style="font-size:2.4rem">+</b>' + dado(ultimo ? ultimo.d[1] : 4);
    else if (exp === 'urna'){
      h = '<div><div id="urna">'; urna.forEach(function(k, j){ for (var i = 0; i < k; i++) h += '<div class="bola" style="background:' + CORES_URNA[j][1] + '"></div>'; }); h += '</div></div>';
      if (ultimo) h += '<div class="bola grande pula" style="background:' + def.cores[ultimo.i] + '"></div>';
    } else h = roda();
    $('palco').innerHTML = h;
  }
  // ---------- gráficos ----------
  var gB = null, gL = null;
  function graficos(){
    if (gB) gB.destroy(); if (gL) gL.destroy();
    var tot = somaPesos(), teo = def.peso.map(function(p){ return +(p / tot * 100).toFixed(2); });
    gB = new Chart($('grafBarras'), {type: 'bar', data: {labels: def.nomes, datasets: [
      {label: 'O que saiu (%)', data: def.nomes.map(function(){ return 0; }), backgroundColor: def.cores || '#2f80ed', borderRadius: 6},
      {label: 'Teoria (%)', data: teo, backgroundColor: 'rgba(31,42,68,.18)', borderColor: '#1f2a44', borderWidth: 2, borderDash: [6, 4], borderRadius: 6}]},
      options: {responsive: true, maintainAspectRatio: false, animation: {duration: 400}, scales: {y: {beginAtZero: true, suggestedMax: Math.min(100, Math.max.apply(null, teo) * 1.6), title: {display: true, text: '%'}}}}});
    gL = new Chart($('grafLinha'), {type: 'line', data: {labels: [], datasets: [
      {label: 'Frequência (%)', data: [], borderColor: '#e74c3c', borderWidth: 3, pointRadius: 0, tension: 0.15},
      {label: 'Teoria (%)', data: [], borderColor: '#1f2a44', borderWidth: 2, borderDash: [8, 6], pointRadius: 0}]},
      options: {responsive: true, maintainAspectRatio: false, animation: false, scales: {x: {type: 'linear', title: {display: true, text: 'lançamentos'}, ticks: {precision: 0}}, y: {beginAtZero: true, max: 100, title: {display: true, text: '%'}}}}});
  }
  function atualizar(){
    var tot = somaPesos(), foco = +$('selFoco').value || 0;
    gB.data.datasets[0].data = cont.map(function(c){ return total ? +(c / total * 100).toFixed(2) : 0; }); gB.update();
    var teo = def.peso[foco] / tot * 100;
    gL.data.datasets[0].data = hist.map(function(h){ return {x: h[0], y: +(h[1][foco] / h[0] * 100).toFixed(2)}; });
    gL.data.datasets[1].data = total ? [{x: hist.length ? hist[0][0] : 0, y: teo}, {x: total, y: teo}] : [];
    gL.update();
    var h = '<tr><th>Resultado</th><th>Saiu</th><th>Frequência relativa</th><th>Probabilidade teórica</th></tr>';
    def.nomes.forEach(function(nm, i){ h += '<tr><td>' + nm + '</td><td>' + cont[i] + '</td><td>' + (total ? n(cont[i] / total * 100) + '%' : '–') + '</td><td>' + fracao(def.peso[i], tot) + ' ≈ ' + n(def.peso[i] / tot * 100) + '%</td></tr>'; });
    $('tabela').innerHTML = h;
    $('total').textContent = total.toLocaleString('pt-BR') + ' lançamento' + (total === 1 ? '' : 's');
  }
  function registrar(){   // guarda pontos para a linha (todos no começo, depois espaçados)
    if (total <= 200 || total % Math.ceil(total / 200) === 0) hist.push([total, cont.slice()]);
    if (hist.length > 600) hist = hist.filter(function(_, i){ return i % 2 === 0; });
  }
  function lancar(k){
    for (var j = 0; j < k; j++){ var r = sortear(); cont[r.i]++; total++; ultimo = r; registrar(); }
    if (hist.length && hist[hist.length - 1][0] !== total) hist.push([total, cont.slice()]);
    if (exp === 'roleta'){
      var tot = somaPesos(), a0 = 0; for (var i = 0; i < ultimo.i; i++) a0 += def.peso[i] / tot * 360;
      var meio = a0 + def.peso[ultimo.i] / tot * 360 * (0.2 + Math.random() * 0.6), alvo = 360 - meio, voltas = k === 1 ? 4 : 2;
      giroAtual = giroAtual - (giroAtual % 360) + voltas * 360 + alvo; var el = document.getElementById('roda'); if (el) el.style.transform = 'rotate(' + giroAtual + 'deg)';
    } else palco(true);
    $('resultado').textContent = (k === 1 ? 'Saiu: ' : 'Último: ') + def.nomes[ultimo.i];
    atualizar(); Sala.tom(440 + ultimo.i * 50, 0.08);
    conferirAposta(k);
  }
  // ---------- aposta da turma ----------
  function painelAposta(){
    if (exp === 'moeda' || exp === 'dado'){ $('aposta').innerHTML = '🤔 <b>Pergunta para a turma:</b> ' + (exp === 'moeda' ? 'se jogarmos 10 vezes, vai dar exatamente 5 caras?' : 'em 60 lançamentos, cada número sai exatamente 10 vezes?') + ' Faça 10 (ou 100) lançamentos e confira!'; aposta = null; return; }
    $('aposta').innerHTML = '🎯 <b>Aposta da turma:</b> qual resultado vai sair mais em 100 lançamentos? <select id="selAposta"><option value="">—</option>' + def.nomes.map(function(nm, i){ return '<option value="' + i + '">' + nm + '</option>'; }).join('') + '</select> Escolha e aperte “100 vezes”. <span id="rAposta"></span>';
    $('selAposta').onchange = function(){ aposta = this.value === '' ? null : +this.value; };
  }
  function conferirAposta(k){
    if (aposta === null || k < 100 || !$('rAposta')) return;
    var max = Math.max.apply(null, cont), venc = cont.indexOf(max);
    $('rAposta').innerHTML = venc === aposta ? ' ✅ Acertaram! Saiu mais ' + def.nomes[venc] + '.' : ' ❌ Saiu mais ' + def.nomes[venc] + '.';
    if (exp === 'soma') $('rAposta').innerHTML += ' O 7 tem mais jeitos de sair: 1+6, 2+5, 3+4, 4+3, 5+2, 6+1 (6 de 36).';
  }
  // ---------- configuração ----------
  function config(){
    var h = '';
    if (exp === 'urna') h = '<b>Bolinhas na urna:</b> ' + CORES_URNA.map(function(c, j){ return '<label>' + c[0] + ' <input type="number" min="0" max="12" value="' + urna[j] + '" data-u="' + j + '"></label>'; }).join('') + '<span class="mt-dica">(a bolinha volta para a urna depois de cada sorteio)</span>';
    else if (exp === 'roleta') h = '<b>Tamanho das fatias:</b> ' + CORES_URNA.map(function(c, j){ return '<label>' + c[0].split(' ')[0] + ' <input type="number" min="0" max="12" value="' + roleta[j] + '" data-r="' + j + '"></label>'; }).join('') + '<span class="mt-dica">(números maiores = fatias maiores)</span>';
    else h = '<span class="mt-dica">' + {moeda: 'Dois resultados igualmente prováveis: cara ou coroa.', dado: 'Seis faces, todas com a mesma chance.', soma: 'Jogamos dois dados e somamos. Será que todas as somas têm a mesma chance?'}[exp] + '</span>';
    $('config').innerHTML = h;
    var ins = $('config').querySelectorAll('input');
    for (var i = 0; i < ins.length; i++) ins[i].onchange = function(){
      var v = Math.max(0, Math.min(12, Math.round(+this.value) || 0)), lista = this.hasAttribute('data-u') ? urna : roleta, j = +(this.getAttribute('data-u') || this.getAttribute('data-r'));
      var antes = lista[j]; lista[j] = v;
      if (lista.reduce(function(a, b){ return a + b; }, 0) === 0){ lista[j] = antes || 1; Sala.avisar('Precisa ter pelo menos uma.'); }
      this.value = lista[j]; reiniciar();
    };
  }
  function reiniciar(){
    def = definicao(); cont = def.nomes.map(function(){ return 0; }); hist = []; total = 0; ultimo = null;
    $('selFoco').innerHTML = def.nomes.map(function(nm, i){ return '<option value="' + i + '">' + nm + '</option>'; }).join('');
    if (exp === 'soma') $('selFoco').value = '5'; else if (exp === 'dado') $('selFoco').value = '5';
    $('resultado').textContent = ''; palco(false); graficos(); atualizar(); painelAposta();
  }
  $('exps').onclick = function(e){
    var b = e.target.closest('button'); if (!b) return; exp = b.getAttribute('data-e');
    var bs = $('exps').querySelectorAll('button'); for (var i = 0; i < bs.length; i++) bs[i].className = bs[i] === b ? 'ativo' : '';
    config(); reiniciar();
  };
  document.querySelector('.mt-colunas').addEventListener('click', function(e){ var b = e.target.closest('[data-n]'); if (b) lancar(+b.getAttribute('data-n')); });
  $('btZerar').onclick = reiniciar;
  $('selFoco').onchange = atualizar;
  window.PROB = {lancar: lancar, estado: function(){ return {exp: exp, total: total, cont: cont.slice(), hist: hist.length, def: def}; }};
  config(); reiniciar();
})();
</script>
</body>
</html>

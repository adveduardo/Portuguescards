<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordene</title>
<link rel="stylesheet" href="jogo-ao-vivo.css">
<style>
  #contador{text-align:center;opacity:.7}
  #tituloSeq{text-align:center;font-size:clamp(1.6rem,4vw,2.6rem);font-weight:bold;margin:6px 0}
  #pista{display:flex;align-items:stretch;gap:10px;max-width:1200px;margin:14px auto;background:#fff;border-radius:26px;padding:16px;box-shadow:0 6px 0 #0001}
  .ponta{display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:clamp(1rem,2.2vw,1.4rem);color:#fff;border-radius:16px;padding:8px 12px;min-width:90px;text-align:center}
  #esq{background:linear-gradient(90deg,#4dabf7,#74c0fc)}
  #dir{background:linear-gradient(90deg,#ff922b,#fa5252)}
  #slots{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;position:relative}
  #slots::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;background:linear-gradient(90deg,#74c0fc,#ffd43b,#fa5252);border-radius:3px;z-index:0}
  .slot{position:relative;z-index:1;min-width:120px;min-height:74px;border:4px dashed #9aa6bf;border-radius:18px;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:clamp(1.2rem,2.8vw,1.9rem);font-weight:bold;cursor:pointer;padding:4px 12px}
  .slot small{font-size:.8rem;opacity:.5}
  .slot.cheio{border-style:solid;border-color:var(--azul);background:#eaf2ff}
  .slot.certo{border-color:var(--verde);background:#e3f8ea}
  .slot.errado{border-color:var(--vermelho);background:#ffe3e3}
  #pecas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0}
  #pecas button{font-size:clamp(1.3rem,3vw,2rem);padding:12px 22px;background:var(--azul);color:#fff}
  #pecas button.usada{visibility:hidden}
  #resultado{text-align:center;font-size:clamp(1.2rem,2.8vw,1.8rem);font-weight:bold;min-height:1.5em;max-width:1000px;margin:0 auto}
  @media (max-width:800px){ #pista{flex-direction:column} }
</style>
<script src="visual.js"></script>
</head>
<body>

<section id="tConfig" class="tela ativa">
  <h1 id="tituloConfig">📶 Ordene</h1>
  <div class="cartao">
    <h2>1. Sequências (JSON)</h2>
    <label>Arquivo: <select id="selArquivo"></select></label>
    <div class="linha" style="justify-content:flex-start">
      <button id="btnAbrirJson">📂 Abrir outro JSON do computador</button>
      <button id="btnModelo">📄 Baixar o modelo</button>
    </div>
    <input type="file" id="arquivoJson" accept=".json,application/json" hidden>
    <div id="infoJson" class="dica"></div>
  </div>
  <div class="cartao">
    <h2>2. Quem joga</h2>
    <label>Equipes: <select id="selEquipes"><option value="0" selected>A turma toda junta</option><option value="2">2 equipes</option><option value="3">3 equipes</option><option value="4">4 equipes</option></select></label>
    <label><input type="checkbox" id="chkSom" checked> Sons e voz</label>
    <p class="dica">Toque nas palavras na ordem certa, da ponta esquerda para a direita. Acertou de primeira = 2 pontos; na segunda tentativa = 1.</p>
  </div>
  <button id="btnComecar" class="principal">▶️ Começar</button>
</section>

<section id="tJogo" class="tela">
  <div class="barraEquipes" id="barraEquipes"></div>
  <div id="contador"></div>
  <div id="tituloSeq"></div>
  <div id="pista"><div class="ponta" id="esq"></div><div id="slots"></div><div class="ponta" id="dir"></div></div>
  <div id="pecas"></div>
  <div id="resultado"></div>
  <div class="linha">
    <button id="btnLimpar">↩️ Recomeçar</button>
    <button id="btnProxima" class="principal" hidden>➡️ Próxima</button>
    <button id="btnSair">⏹️ Terminar</button>
  </div>
</section>

<section id="tFim" class="tela">
  <h1>🏆 Resultado</h1>
  <div id="ranking" class="ranking"></div>
  <div class="linha"><button id="btnDeNovo" class="principal">🔁 Jogar de novo</button></div>
</section>

<script src="jogo-ao-vivo.js"></script>
<script src="morfologia.js"></script>
<script>
const $ = id => document.getElementById(id);
const AV = window.AoVivo, M = window.Morfo;
let dados = null, fila = [], atual = null, n = 0, total = 0, placar = null, colocadas = [], pecas = [], resolvido = false, tentativas = 0;

function carregar(d, origem){
  if (!d || !Array.isArray(d.sequencias)) return AV.avisar('JSON inválido: falta a lista "sequencias".');
  const seqs = d.sequencias.filter(s => s && Array.isArray(s.itens) && s.itens.length >= 2).map(s => ({
    titulo: String(s.titulo || 'Coloque em ordem'), esquerda: s.esquerda || '⬅️', direita: s.direita || '➡️', itens: s.itens.map(String), explica: s.explica || ''}));
  if (!seqs.length) return AV.avisar('Nenhuma sequência válida.');
  dados = {titulo: d.titulo || 'Ordene', seqs};
  $('tituloConfig').textContent = '📶 ' + dados.titulo; document.title = dados.titulo;
  $('infoJson').textContent = `${dados.titulo} • ${seqs.length} sequências` + (origem ? ` • ${origem}` : '');
}
AV.prepararSeletorJson({tipo: 'morfo-ordene', select: $('selArquivo'), botaoAbrir: $('btnAbrirJson'), input: $('arquivoJson'), aoCarregar: carregar});
$('btnModelo').onclick = () => AV.baixarArquivo('dados/morfo-adv-linha-tempo.json', 'modelo-ordene.json');

function comecar(){
  if (!dados) return AV.avisar('Carregue um JSON.');
  AV.som = $('chkSom').checked;
  fila = dados.seqs.slice(); total = fila.length; n = 0;
  placar = M.criarPlacar($('barraEquipes'), +$('selEquipes').value);
  AV.mostrarTela('tJogo'); proxima();
}
function proxima(){
  if (!fila.length) return fim();
  atual = fila.shift(); n++; resolvido = false; tentativas = 0;
  colocadas = atual.itens.map(() => null);
  // embaralha até ficar fora da ordem certa
  let emb, k = 0; do { emb = M.embaralhar(atual.itens); } while (k++ < 20 && emb.join('|') === atual.itens.join('|'));
  pecas = emb.map((t, i) => ({t, i}));
  $('contador').textContent = `${placar.prefixo()}Sequência ${n} de ${total}`;
  $('tituloSeq').textContent = atual.titulo;
  $('esq').textContent = atual.esquerda; $('dir').textContent = atual.direita;
  $('resultado').textContent = ''; $('btnProxima').hidden = true;
  desenhar();
  if (AV.som) AV.falar(atual.titulo);
}
function desenhar(){
  $('slots').innerHTML = colocadas.map((p, i) => `<div class="slot ${p ? 'cheio' : ''}" data-i="${i}">${p ? AV.esc(p.t) : ''}<small>${i + 1}º</small></div>`).join('');
  $('slots').querySelectorAll('.slot').forEach(s => s.onclick = () => { if (resolvido) return; const i = +s.dataset.i; if (colocadas[i]){ colocadas[i] = null; desenhar(); } });
  $('pecas').innerHTML = pecas.map(p => `<button class="${colocadas.includes(p) ? 'usada' : ''}" data-i="${p.i}">${AV.esc(p.t)}</button>`).join('');
  $('pecas').querySelectorAll('button').forEach(b => b.onclick = () => {
    if (resolvido) return;
    const p = pecas.find(x => x.i === +b.dataset.i), v = colocadas.indexOf(null);
    if (v < 0) return;
    colocadas[v] = p; AV.tom(600 + v * 80, .07); desenhar();
    if (!colocadas.includes(null)) conferir();
  });
}
function conferir(){
  const certo = colocadas.every((p, i) => p.t === atual.itens[i]);
  const slots = $('slots').querySelectorAll('.slot');
  if (certo){
    resolvido = true; slots.forEach(s => s.classList.add('certo'));
    placar.pontuar(tentativas === 0 ? 2 : 1);
    $('resultado').textContent = `✅ Ordem certa! ${atual.explica}`;
    AV.fanfarra(); AV.confete(); if (AV.som) AV.falar(atual.itens.join(', ') + '. ' + atual.explica);
    $('btnProxima').hidden = false; $('btnProxima').textContent = fila.length ? '➡️ Próxima' : '🏆 Ver resultado';
  } else {
    tentativas++;
    colocadas.forEach((p, i) => { if (p.t !== atual.itens[i]) slots[i].classList.add('errado'); });
    AV.erro();
    if (tentativas >= 2){
      resolvido = true;
      setTimeout(() => {
        colocadas = atual.itens.map(t => pecas.find(p => p.t === t));
        desenhar(); $('slots').querySelectorAll('.slot').forEach(s => s.classList.add('certo'));
      }, 1200);
      $('resultado').textContent = `💡 A ordem certa é: ${atual.itens.join(' → ')}. ${atual.explica}`;
      $('btnProxima').hidden = false; $('btnProxima').textContent = fila.length ? '➡️ Próxima' : '🏆 Ver resultado';
    } else {
      $('resultado').textContent = '🤔 Quase! As vermelhas estão fora do lugar. Tentem de novo.';
      setTimeout(() => { if (!resolvido){ colocadas = colocadas.map((p, i) => p && p.t === atual.itens[i] ? p : null); desenhar(); } }, 1300);
    }
  }
}
function fim(){ AV.mostrarTela('tFim'); placar.ranking($('ranking'), total * 2); AV.fanfarra(); AV.confete(); }
$('btnComecar').onclick = comecar;
$('btnLimpar').onclick = () => { if (!resolvido){ colocadas = colocadas.map(() => null); desenhar(); } };
$('btnProxima').onclick = () => { placar.proxima(); proxima(); };
$('btnSair').onclick = () => { if (confirm('Terminar e ver o resultado?')) fim(); };
$('btnDeNovo').onclick = () => AV.mostrarTela('tConfig');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Português em 30 encontros</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#eef2f8;color:#14213d}
  .pag{max-width:1100px;margin:0 auto;padding:16px}
  h1{font-size:clamp(1.4rem,3.4vw,2.2rem);margin:6px 0 2px;color:#1f3a68}
  .sub{color:#4a5a78;margin:0 0 14px}
  .barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .bt{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:bold;cursor:pointer;background:#1f3a68;color:#fff;text-decoration:none}
  .bt.claro{background:#fff;color:#1f3a68;border:2px solid #c6d3ea}
  .bt.ouro{background:#ffd54a;color:#1a1a1a}
  select{font-size:16px;padding:9px 10px;border-radius:10px;border:2px solid #c6d3ea;max-width:100%}
  .cartao{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(20,33,61,.08)}
  .cartao h2{margin:0 0 10px;font-size:1.2rem;color:#1f3a68}
  .etiqueta{display:inline-block;background:#dce6f5;color:#1f3a68;border-radius:999px;padding:3px 12px;font-weight:bold;font-size:14px}
  /* plano */
  .plano{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .etapa{border:2px solid #dce6f5;border-radius:12px;padding:10px;background:#f7f9fd}
  .etapa b{display:block;color:#1f3a68}
  .etapa .min{font-size:13px;color:#4a5a78;font-weight:bold}
  .etapa p{margin:6px 0 0;font-size:14px;line-height:1.35}
  .etapa.agora{border-color:#e0a800;background:#fff6d5;box-shadow:0 0 0 3px #ffd54a inset}
  .etapa.feita{opacity:.55}
  #relogio{font-weight:bold;font-size:18px;color:#1f3a68}
  /* quadro */
  #quadro{background:#1f4d3a;background:linear-gradient(180deg,#24563f,#1b4433);color:#f4f7ef;border:10px solid #8a5a2b;border-radius:14px;padding:18px 22px;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:clamp(1rem,1.9vw,1.25rem);line-height:1.45}
  #quadro .tit{font-size:1.35em;font-weight:bold;color:#ffe680;margin:10px 0 4px}
  #quadro .tit:first-child{margin-top:0}
  #quadro .li{margin:2px 0 2px 1.1em;text-indent:-1.1em}
  #quadro .sec{-webkit-column-break-inside:avoid;break-inside:avoid}
  /* tela cheia: a letra cresce até ocupar o quadro todo (ajustada pelo script); em tela larga, duas colunas */
  #quadro:fullscreen{width:100vw;height:100vh;border-width:0;border-radius:0;padding:2.5vh 3vw;overflow:hidden;-webkit-column-gap:4vw;column-gap:4vw;-webkit-column-fill:auto;column-fill:auto}
  #quadro:-webkit-full-screen{width:100vw;height:100vh;border-width:0;border-radius:0;padding:2.5vh 3vw;overflow:hidden;-webkit-column-gap:4vw;column-gap:4vw;-webkit-column-fill:auto;column-fill:auto}
  #quadro.duas{-webkit-column-count:2;column-count:2;-webkit-column-rule:2px dashed rgba(255,255,255,.25);column-rule:2px dashed rgba(255,255,255,.25)}
  /* questões */
  .q{border-bottom:1px solid #e3e9f4;padding:8px 0}
  .q .enun{font-weight:bold}
  .q .ops{color:#4a5a78;font-size:15px;margin-top:2px}
  .q .resp{display:none;margin-top:4px;background:#e7f7ec;color:#135d2e;border-radius:8px;padding:4px 10px;font-weight:bold}
  .mostrar .q .resp,.q.aberta .resp{display:block}
  .q{cursor:pointer}
  /* visão geral */
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .item{display:block;background:#fff;border-radius:14px;padding:12px;text-decoration:none;color:#14213d;border:2px solid transparent;box-shadow:0 2px 8px rgba(20,33,61,.07)}
  .item:hover{border-color:#1f3a68}
  .item .n{font-size:13px;font-weight:bold;color:#4a5a78}
  .item .t{font-weight:bold;margin-top:2px;line-height:1.3}
  .bloco{margin:18px 0 8px;color:#1f3a68}
  @media (max-width:800px){.plano{grid-template-columns:1fr 1fr}}
  @media (max-width:480px){.plano{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pag" id="app"><p>Carregando…</p></div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function dois(n){ return (n < 10 ? '0' : '') + n; }
  function param(n){ var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
  var D = null, atual = 0, relogio = null, inicio = 0;

  function visaoGeral(){
    var h = '<h1>📘 Português em 30 encontros</h1><p class="sub">Da ortografia à sintaxe. Cada encontro tem 2 aulas de 50 minutos: o que passar no quadro e uma folha de atividade em Word (15 a 20 questões, frente e verso).</p>';
    h += '<div class="barra"><a class="bt ouro" href="encontros/todas-as-folhas.zip" download>🗂️ Baixar todas as folhas (Word, .zip)</a><a class="bt claro" href="encontros/guia-do-professor.docx" download>📘 Guia do professor (planos, quadro e gabaritos)</a></div>';
    var bloco = '';
    D.encontros.forEach(function(e){
      if (e.bloco !== bloco){ if (bloco) h += '</div>'; bloco = e.bloco; h += '<h2 class="bloco">' + esc(bloco) + '</h2><div class="grade">'; }
      h += '<a class="item" href="?n=' + e.n + '"><div class="n">Encontro ' + dois(e.n) + '</div><div class="t">' + esc(e.titulo) + '</div></a>';
    });
    $('app').innerHTML = h + '</div>';
  }

  function encontro(n){
    var e = D.encontros[n - 1]; atual = n;
    var op = D.encontros.map(function(x){ return '<option value="' + x.n + '"' + (x.n === n ? ' selected' : '') + '>Encontro ' + dois(x.n) + ': ' + esc(x.titulo) + '</option>'; }).join('');
    var h = '<div class="barra"><a class="bt claro" href="?">🗂️ Todos</a><button class="bt claro" id="btAnt"' + (n === 1 ? ' disabled' : '') + '>◀</button><select id="selEnc" aria-label="Encontro">' + op + '</select><button class="bt claro" id="btProx"' + (n === 30 ? ' disabled' : '') + '>▶</button></div>';
    h += '<span class="etiqueta">' + esc(e.bloco) + '</span><h1>Encontro ' + dois(n) + ': ' + esc(e.titulo) + '</h1>';
    h += '<div class="barra" style="margin-top:8px"><a class="bt ouro" id="btWord" href="encontros/encontro-' + dois(n) + '.docx" download>📄 Baixar a folha (Word)</a><a class="bt claro" href="encontros/guia-do-professor.docx" download>📘 Guia do professor</a></div>';
    h += '<div class="cartao"><h2>⏱️ Plano das duas aulas <span id="relogio"></span></h2><div class="plano">';
    D.plano.forEach(function(p, i){
      h += '<div class="etapa" id="et' + i + '"><span class="min">Aula ' + p.aula + ' • ' + p.inicio + '–' + p.fim + ' min</span><b>' + esc(p.etapa) + '</b><p>' + esc(p.etapa === 'Aquecimento' ? e.aquecimento : p.como) + '</p></div>';
    });
    h += '</div><div class="barra" style="margin:10px 0 0"><button class="bt" id="btAula">▶️ Começar a aula (marca a etapa)</button></div></div>';
    h += '<div class="cartao"><h2>🧑‍🏫 No quadro <button class="bt claro" id="btTela" style="float:right;padding:6px 12px;font-size:14px">🖥️ Tela cheia</button></h2><div id="quadro">';
    var aberta = false;
    e.quadro.forEach(function(l){
      if (l.indexOf('# ') === 0){ h += (aberta ? '</div>' : '') + '<div class="sec"><div class="tit">' + esc(l.slice(2)) + '</div>'; aberta = true; }
      else h += '<div class="li">' + esc(l.replace(/^- /, '• ')) + '</div>';
    });
    h += (aberta ? '</div>' : '') + '</div></div>';
    h += '<div class="cartao" id="corr"><h2>✅ Correção da folha <button class="bt claro" id="btGab" style="float:right;padding:6px 12px;font-size:14px">👁️ Mostrar todo o gabarito</button></h2><p class="sub" style="margin:0 0 6px">Toque em uma questão para ver só a resposta dela.</p>';
    e.questoes.forEach(function(q, i){
      h += '<div class="q"><div class="enun">' + (i + 1) + '. ' + esc(q.enunciado) + '</div>' + (q.opcoes ? '<div class="ops">' + q.opcoes.map(function(o, k){ return 'abcd'.charAt(k) + ') ' + esc(o); }).join('   •   ') + '</div>' : '') + '<div class="resp">' + esc(q.resposta) + '</div></div>';
    });
    h += '<div class="q"><div class="enun">' + (e.questoes.length + 1) + '. ✍️ Produção: ' + esc(e.producao) + '</div><div class="resp">Resposta pessoal: confira se a proposta foi cumprida.</div></div></div>';
    $('app').innerHTML = h;
    $('selEnc').onchange = function(){ ir(+this.value); };
    $('btAnt').onclick = function(){ ir(n - 1); };
    $('btProx').onclick = function(){ ir(n + 1); };
    $('btGab').onclick = function(){ var c = $('corr'); var m = /mostrar/.test(c.className); c.className = 'cartao' + (m ? '' : ' mostrar'); this.textContent = m ? '👁️ Mostrar todo o gabarito' : '🙈 Esconder o gabarito'; };
    var qs = document.querySelectorAll('#corr .q');
    for (var i = 0; i < qs.length; i++) qs[i].onclick = function(){ this.className = /aberta/.test(this.className) ? 'q' : 'q aberta'; };
    $('btTela').onclick = function(){ var q = $('quadro'); var f = q.requestFullscreen || q.webkitRequestFullscreen; if (f) f.call(q); };
    $('btAula').onclick = alternarAula;
    pararAula();
  }
  // tela cheia: maior letra que cabe no quadro inteiro (duas colunas se a tela for larga e isso deixar a letra maior)
  function cabe(q){ return q.scrollHeight <= q.clientHeight + 1 && q.scrollWidth <= q.clientWidth + 1; }
  function maiorLetra(q){ var lo = 10, hi = 160; while (hi - lo > 1){ var m = (lo + hi) >> 1; q.style.fontSize = m + 'px'; if (cabe(q)) lo = m; else hi = m; } q.style.fontSize = lo + 'px'; return lo; }
  function ajustarQuadro(){
    var q = $('quadro'); if (!q) return;
    var cheia = document.fullscreenElement === q || document.webkitFullscreenElement === q;
    if (!cheia){ q.className = ''; q.style.fontSize = ''; return; }
    q.className = ''; var uma = maiorLetra(q);
    if (window.innerWidth > window.innerHeight * 1.2){ q.className = 'duas'; var duas = maiorLetra(q); if (duas <= uma){ q.className = ''; maiorLetra(q); } }
  }
  document.addEventListener('fullscreenchange', function(){ setTimeout(ajustarQuadro, 60); });
  document.addEventListener('webkitfullscreenchange', function(){ setTimeout(ajustarQuadro, 60); });
  window.addEventListener('resize', function(){ setTimeout(ajustarQuadro, 60); });
  function ir(n){ if (n < 1 || n > 30) return; try { history.replaceState(null, '', '?n=' + n); } catch (e) {} encontro(n); window.scrollTo(0, 0); }

  // cronômetro das duas aulas: destaca a etapa do momento
  function alternarAula(){ if (relogio) pararAula(); else { inicio = Date.now(); relogio = setInterval(marcar, 1000); marcar(); $('btAula').textContent = '⏹️ Parar o cronômetro'; } }
  function pararAula(){ if (relogio) clearInterval(relogio); relogio = null; if ($('relogio')) $('relogio').textContent = ''; if ($('btAula')) $('btAula').textContent = '▶️ Começar a aula (marca a etapa)'; for (var i = 0; i < D.plano.length; i++) if ($('et' + i)) $('et' + i).className = 'etapa'; }
  function marcar(){
    var min = (Date.now() - inicio) / 60000, s = Math.floor((Date.now() - inicio) / 1000);
    $('relogio').textContent = '• ' + Math.floor(s / 60) + ':' + dois(s % 60);
    for (var i = 0; i < D.plano.length; i++){ var p = D.plano[i]; $('et' + i).className = 'etapa' + (min >= p.fim ? ' feita' : min >= p.inicio ? ' agora' : ''); }
  }

  var x = new XMLHttpRequest();
  x.open('GET', 'dados/encontros-portugues.json', true);
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    try { D = JSON.parse(x.responseText); } catch (e) { $('app').innerHTML = '<p>Não consegui abrir os encontros.</p>'; return; }
    var n = +param('n');
    if (n >= 1 && n <= 30) encontro(n); else visaoGeral();
  };
  x.send();
  window.ENCONTROS = {dados: function(){ return D; }, atual: function(){ return atual; }, ajustar: ajustarQuadro, maiorLetra: maiorLetra};
})();
</script>
</body>
</html>

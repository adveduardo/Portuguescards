<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sapo Saltador</title>
<link rel="stylesheet" href="arcade.css">
<script src="visual.js"></script>
<script src="sala.js"></script>
<script src="arcade.js"></script>
</head>
<body class="escuro">
<canvas id="cv" class="palcoJogo"></canvas>
<div id="hud" style="display:none">
  <span class="chip" id="hTab"></span><span class="chip" id="hProx"></span><span class="chip" id="hVidas"></span><span class="chip" id="hPontos"></span>
  <button type="button" id="btSom">🔊</button><button type="button" id="btSair">⏹️</button>
</div>
<div id="aviso"></div>
<div class="tela ativa" id="tConfig"><div class="cartao">
  <h1>🐸 Sapo Saltador</h1>
  <p>O sapo precisa atravessar o rio pulando <b>só nas vitórias-régias da tabuada</b>, em ordem: na do 7 é 7, 14, 21, 28… Pulou no número errado? Splash! 💦</p>
  <label>Tabuada: <select id="selTab"><option value="0">uma de cada vez (2 até 9)</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option></select></label>
  <label>Ordem: <select id="selOrdem"><option value="sobe" selected>crescente (7, 14, 21…)</option><option value="desce">decrescente (70, 63, 56…)</option></select></label>
  <p><button type="button" class="principal" id="btComecar">▶️ Começar</button></p>
  <p class="dica">Toque (ou clique) na próxima vitória-régia. Errar 3 vezes faz o sapo voltar para a margem.</p>
</div></div>
<div class="tela" id="tFase"><div class="cartao" id="cFase"></div></div>
<script>
(function(){
  'use strict';
  var $ = ARC.$, esc = ARC.esc, jogo = null, laco = ARC.laco(passo), tela = ARC.canvas($('cv'), function(){ if (jogo) posicionar(); if (!laco.rodando) desenhar(); }), ctx = tela.ctx;

  function comecar(){
    var t = +$('selTab').value;
    jogo = {fila: t ? [t] : [2, 3, 4, 5, 6, 7, 8, 9], fase: 0, pontos: 0, ordem: $('selOrdem').value};
    novaFase();
  }
  function novaFase(){
    var n = jogo.fila[jogo.fase], seq = [], i;
    for (i = 1; i <= 10; i++) seq.push(n * i);
    if (jogo.ordem === 'desce') seq.reverse();
    var outros = [], vistos = {}; seq.forEach(function(v){ vistos[v] = 1; });
    while (outros.length < 18){ var x = n + Math.floor(Math.random() * (n * 10)); if (x % n && !vistos[x]){ vistos[x] = 1; outros.push(x); } }
    var nums = ARC.embaralhar(seq.concat(outros));
    jogo.n = n; jogo.seq = seq; jogo.k = 0; jogo.vidas = 3; jogo.erros = 0; jogo.vitorias = nums.map(function(v){ return {v: v, ok: false}; });
    jogo.sapo = {x: 0, y: 0, de: null, para: null, t: 1, caindo: 0}; jogo.fx = []; jogo.trilha = [];
    posicionar(); jogo.sapo.x = jogo.margemB.x; jogo.sapo.y = jogo.margemB.y;
    $('cFase').innerHTML = '<h2>🐸 Tabuada do ' + n + '</h2><p style="font-size:24px">Pule na ordem: <b>' + seq.slice(0, 3).join(', ') + '…</b></p><button type="button" class="principal" id="btIr">🐸 Pular!</button>';
    ARC.tela('tFase'); $('btIr').onclick = function(){ ARC.tela(null); $('hud').style.display = ''; pintarHud(); laco.iniciar(); };
  }
  function posicionar(){   // vitórias-régias espalhadas numa grade de 7 × 4 com um pouco de bagunça
    var W = tela.W, H = tela.H, cols = 7, rows = 4, x0 = W * 0.08, y0 = H * 0.2, cw = W * 0.84 / cols, ch = H * 0.58 / rows;
    jogo.r = Math.min(cw, ch) * 0.36;
    jogo.vitorias.forEach(function(p, i){
      var c = i % cols, r = Math.floor(i / cols);
      if (p.jx === undefined){ p.jx = (Math.random() - 0.5) * 0.35; p.jy = (Math.random() - 0.5) * 0.35; }
      p.x = x0 + (c + 0.5 + p.jx) * cw; p.y = y0 + (r + 0.5 + p.jy) * ch;
    });
    jogo.margemB = {x: W / 2, y: H * 0.9}; jogo.margemC = {x: W / 2, y: H * 0.1};
  }
  function pintarHud(){
    $('hTab').textContent = '🐸 Tabuada do ' + jogo.n; $('hProx').textContent = jogo.k < 10 ? 'Próxima: ?' : '🏁 Margem!';
    $('hVidas').textContent = '❤️❤️❤️'.slice(0, jogo.vidas * 2) + '♡♡♡'.slice(0, 3 - jogo.vidas); $('hPontos').textContent = '⭐ ' + jogo.pontos;
  }
  function pular(alvo){
    var s = jogo.sapo; if (s.t < 1 || s.caindo > 0) return;
    s.de = {x: s.x, y: s.y}; s.para = {x: alvo.x, y: alvo.y, p: alvo.v !== undefined ? alvo : null}; s.t = 0;   // p = null: pulo para a margem ARC.tom(520, 0.06); ARC.tom(780, 0.08, 0.08);
  }
  function chegou(p){
    if (!p){ return fimFase(); }
    if (p.v === jogo.seq[jogo.k]){
      p.ok = true; jogo.k++; jogo.pontos += 10; jogo.trilha.push({x: p.x, y: p.y}); ARC.plim();
      jogo.fx.push({x: p.x, y: p.y - jogo.r, t: 0, txt: String(p.v), cor: '#7CFFB2'});
      if (jogo.k >= 10){ setTimeout(function(){ pular({x: jogo.margemC.x, y: jogo.margemC.y}); }, 350); }
    } else {
      jogo.vidas--; jogo.erros++; jogo.sapo.caindo = 1; ARC.erro();
      for (var i = 0; i < 14; i++) jogo.fx.push({x: p.x, y: p.y, t: 0, gota: true, vx: (Math.random() - 0.5) * 240, vy: -120 - Math.random() * 200});
      var antes = jogo.k ? jogo.seq[jogo.k - 1] : null;
      ARC.aviso('💦 Splash! ' + p.v + ' não vem agora. ' + (antes !== null ? 'Depois de ' + antes + ' vem ' + jogo.seq[jogo.k] + '.' : 'Comece pelo ' + jogo.seq[0] + '.'), 2600);
      if (jogo.vidas <= 0){ jogo.vidas = 3; jogo.k = 0; jogo.trilha = []; jogo.vitorias.forEach(function(q){ q.ok = false; }); setTimeout(function(){ ARC.aviso('🐸 De volta para a margem! Tente de novo.', 2200); }, 1200); }
    }
    pintarHud();
  }
  function fimFase(){
    laco.parar(); $('hud').style.display = 'none';
    var est = jogo.erros === 0 ? 3 : jogo.erros <= 2 ? 2 : 1, ultima = jogo.fase >= jogo.fila.length - 1;
    jogo.pontos += est * 10;
    $('cFase').innerHTML = '<h2>🎉 O sapo atravessou!</h2><p style="font-size:30px">' + '⭐⭐⭐'.slice(0, est) + '☆☆☆'.slice(0, 3 - est) + '</p><p style="font-size:22px">' + jogo.seq.join(' • ') + '</p>' +
      '<button type="button" class="principal" id="btIr">' + (ultima ? '🏆 Terminar' : '➡️ Tabuada do ' + jogo.fila[jogo.fase + 1]) + '</button>';
    ARC.tela('tFase'); ARC.festa();
    $('btIr').onclick = function(){ if (ultima){ $('cFase').innerHTML = '<h1>🏆 ' + jogo.pontos + ' pontos!</h1><button type="button" class="principal" id="btDeNovo">🔁 Jogar de novo</button>'; $('btDeNovo').onclick = function(){ ARC.tela('tConfig'); }; } else { jogo.fase++; novaFase(); } };
  }
  function passo(dt){
    if (dt && jogo){
      var s = jogo.sapo;
      if (s.t < 1){
        s.t = Math.min(1, s.t + dt * 2.4);
        var e = s.t, h = Math.sin(e * Math.PI) * jogo.r * 1.6;
        s.x = s.de.x + (s.para.x - s.de.x) * e; s.y = s.de.y + (s.para.y - s.de.y) * e - h;
        if (s.t >= 1){ s.x = s.para.x; s.y = s.para.y; chegou(s.para.p); }
      }
      if (s.caindo > 0){ s.caindo -= dt * 1.2; if (s.caindo <= 0){ s.caindo = 0; var u = jogo.trilha[jogo.trilha.length - 1] || jogo.margemB; s.x = u.x; s.y = u.y; } }
      for (var i = jogo.fx.length - 1; i >= 0; i--){ var f = jogo.fx[i]; f.t += dt; if (f.gota){ f.vy += 600 * dt; f.x += f.vx * dt; f.y += f.vy * dt; } if (f.t > 1.2) jogo.fx.splice(i, 1); }
    }
    desenhar();
  }
  function desenhar(){
    var W = tela.W, H = tela.H, E = tela.ESC, i;
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2b8fd6'); g.addColorStop(1, '#1c6fb3'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#6cc04a'; ctx.fillRect(0, 0, W, H * 0.14); ctx.fillRect(0, H * 0.86, W, H * 0.14);
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 2; var tt = Date.now() / 900;
    for (var yy = H * 0.18; yy < H * 0.84; yy += 34){ ctx.beginPath(); for (var xx = 0; xx <= W; xx += 18){ var y = yy + Math.sin(xx / 40 + tt + yy) * 3; if (xx) ctx.lineTo(xx, y); else ctx.moveTo(xx, y); } ctx.stroke(); }
    if (!jogo || !jogo.vitorias) return;
    if (jogo.trilha.length){ ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.setLineDash([8, 8]); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(jogo.margemB.x, jogo.margemB.y); jogo.trilha.forEach(function(p){ ctx.lineTo(p.x, p.y); }); ctx.stroke(); ctx.setLineDash([]); }
    var r = jogo.r;
    jogo.vitorias.forEach(function(p){
      ctx.fillStyle = p.ok ? '#9be15d' : '#3fae4a'; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, r, 0.35, 2 * Math.PI - 0.05); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2a7d34'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ARC.fonte(ctx, String(p.v), r * 1.5, Math.round(r * 0.75)); ctx.fillText(String(p.v), p.x, p.y + 1);
    });
    var s = jogo.sapo, fr = Math.max(14, r * 0.62), afund = s.caindo > 0 ? 1 - s.caindo : 0;
    ctx.save(); ctx.translate(s.x, s.y + afund * fr); ctx.globalAlpha = s.caindo > 0 ? s.caindo : 1;
    ctx.fillStyle = '#43a047'; ctx.beginPath(); ctx.ellipse ? ctx.ellipse(0, 0, fr, fr * 0.78, 0, 0, 2 * Math.PI) : ctx.arc(0, 0, fr, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#66bb6a'; ctx.beginPath(); ctx.arc(-fr * 0.45, -fr * 0.6, fr * 0.32, 0, 2 * Math.PI); ctx.fill(); ctx.beginPath(); ctx.arc(fr * 0.45, -fr * 0.6, fr * 0.32, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-fr * 0.45, -fr * 0.62, fr * 0.2, 0, 2 * Math.PI); ctx.fill(); ctx.beginPath(); ctx.arc(fr * 0.45, -fr * 0.62, fr * 0.2, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#1b1530'; ctx.beginPath(); ctx.arc(-fr * 0.45, -fr * 0.6, fr * 0.09, 0, 2 * Math.PI); ctx.fill(); ctx.beginPath(); ctx.arc(fr * 0.45, -fr * 0.6, fr * 0.09, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, fr * 0.45, 0.25, Math.PI - 0.25); ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
    jogo.fx.forEach(function(f){
      ctx.globalAlpha = Math.max(0, 1 - f.t / 1.2);
      if (f.gota){ ctx.fillStyle = '#bfe6ff'; ctx.beginPath(); ctx.arc(f.x, f.y, 5 * E, 0, 2 * Math.PI); ctx.fill(); }
      else { ctx.fillStyle = f.cor; ARC.fonte(ctx, f.txt, 200, Math.round(r * 0.8)); ctx.fillText(f.txt, f.x, f.y - f.t * 50); }
      ctx.globalAlpha = 1;
    });
  }
  function tocar(x, y){
    if (!jogo || !jogo.vitorias || document.querySelector('.tela.ativa')) return;
    for (var i = 0; i < jogo.vitorias.length; i++){ var p = jogo.vitorias[i]; if (!p.ok && (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y) < jogo.r * jogo.r * 1.2) return pular(p); }
  }
  $('cv').addEventListener('mousedown', function(e){ tocar(e.clientX, e.clientY); });
  $('cv').addEventListener('touchstart', function(e){ tocar(e.changedTouches[0].clientX, e.changedTouches[0].clientY); e.preventDefault(); }, {passive: false});
  $('btComecar').onclick = comecar;
  $('btSair').onclick = function(){ if (!confirm('Sair do jogo?')) return; laco.parar(); jogo = null; $('hud').style.display = 'none'; ARC.tela('tConfig'); desenhar(); };
  if (window.Sala) Sala.botaoSom($('btSom'));
  desenhar();
  window.SAPO = {jogo: function(){ return jogo; }, pular: pular};   // usado nos testes
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Relógio Mágico – Aprendendo as Horas</title>
<style>
  :root{
    --cor-hora:#ef5b5b;      /* ponteiro curto = horas */
    --cor-min:#2f80ed;       /* ponteiro longo = minutos */
    --fundo1:#fff4d6;
    --fundo2:#d6f0ff;
    --texto:#243049;
    --verde:#27ae60;
    --vermelho:#e74c3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    color:var(--texto);
    background:linear-gradient(160deg,var(--fundo1),var(--fundo2));
    min-height:100vh;
    user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;align-items:center;
    padding:10px 12px 30px;
  }
  header{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center}
  h1{font-size:clamp(1.3rem,4.5vw,2rem);margin:6px 0}
  #placar{background:#fff;border-radius:999px;padding:6px 16px;font-size:1.3rem;font-weight:bold;box-shadow:0 3px 0 #0001}
  .modos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  button{
    font:inherit;font-weight:bold;border:none;cursor:pointer;
    border-radius:16px;padding:12px 16px;font-size:1.05rem;
    background:#fff;color:var(--texto);box-shadow:0 4px 0 #0002;
    transition:transform .08s, box-shadow .08s;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #0002}
  .modos button.ativo{background:var(--texto);color:#fff}
  main{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center}
  #enunciado{background:#fff;border-radius:18px;padding:10px 18px;font-size:1.25rem;text-align:center;margin:6px 0;box-shadow:0 3px 0 #0001}
  #enunciado b{font-size:1.8rem;color:var(--cor-min)}
  #enunciado small{display:block;font-size:.95rem;opacity:.75}
  .relogio-wrap{width:min(92vw,58vh,470px);aspect-ratio:1;margin:6px 0}
  #relogio{width:100%;height:100%;touch-action:none;display:block;overflow:visible}
  .num-hora{font-size:34px;font-weight:bold;fill:var(--cor-hora);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .num-min{font-size:13px;font-weight:bold;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .ponteiro{transition:none}
  .arrastando-hora #ponteiroHora .visivel, .arrastando-min #ponteiroMin .visivel{filter:drop-shadow(0 0 6px #ffd54a)}
  #digital{font-family:"Courier New",monospace;font-size:clamp(2rem,9vw,3.2rem);font-weight:bold;background:#243049;color:#7CFFB2;border-radius:14px;padding:2px 22px;letter-spacing:2px;margin:4px 0}
  #extenso{font-size:1.25rem;text-align:center;min-height:1.5em;margin:4px 0}
  #extenso small{display:block;opacity:.7;font-size:1rem}
  #opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(92vw,470px);margin:8px 0}
  #opcoes button{font-size:1.7rem;padding:16px}
  #opcoes button.certa{background:var(--verde);color:#fff}
  #opcoes button.errada{background:var(--vermelho);color:#fff}
  .acoes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
  #btnSortear{background:#ffd54a}
  #btnConferir{background:var(--verde);color:#fff}
  .config{background:#ffffffcc;border-radius:16px;padding:8px 14px;margin-top:6px;width:min(92vw,470px)}
  .config summary{font-weight:bold;cursor:pointer;padding:4px 0}
  .config label{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:1.05rem}
  .config input[type=checkbox]{width:24px;height:24px}
  .config select{font:inherit;padding:6px;border-radius:10px}
  .legenda{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:1rem}
  .legenda span{display:flex;align-items:center;gap:6px}
  .legenda i{display:inline-block;height:8px;border-radius:4px}
  [hidden]{display:none !important}
  #feedback{
    position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);
    background:#fff;border-radius:24px;padding:18px 28px;font-size:1.6rem;font-weight:bold;text-align:center;
    box-shadow:0 10px 40px #0003;opacity:0;pointer-events:none;transition:all .25s;z-index:10;max-width:90vw
  }
  #feedback.mostrar{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #feedback .emoji{font-size:3.5rem;display:block}
  .confete{position:fixed;font-size:28px;pointer-events:none;z-index:9;animation:voar 1.4s ease-out forwards}
  @keyframes voar{
    from{transform:translate(0,0) rotate(0);opacity:1}
    to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}
  }
</style>
<script src="visual.js"></script>
</head>
<body>

<header>
  <h1>⏰ Relógio Mágico</h1>
  <div id="placar">⭐ 0</div>
</header>

<nav class="modos">
  <button data-modo="livre" class="ativo">🖐️ Brincar</button>
  <button data-modo="acertar">🎯 Acerte o relógio</button>
  <button data-modo="qual">❓ Que horas são?</button>
</nav>

<main>
  <div id="enunciado" hidden></div>

  <div class="relogio-wrap">
    <svg id="relogio" viewBox="-200 -200 400 400" aria-label="Relógio com ponteiros arrastáveis">
      <circle r="197" fill="#5bb4f0"/>
      <g id="minutos"></g>
      <circle r="172" fill="#fdfcf7"/>
      <g id="ticks"></g>
      <g id="numeros"></g>
      <!-- ponteiro dos minutos (longo) -->
      <g id="ponteiroMin" class="ponteiro" data-ponteiro="min">
        <line class="visivel" x1="0" y1="18" x2="0" y2="-148" stroke="var(--cor-min)" stroke-width="10" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="-160" stroke="rgba(0,0,0,0)" stroke-width="44" pointer-events="stroke" data-ponteiro="min"/>
      </g>
      <!-- ponteiro das horas (curto) -->
      <g id="ponteiroHora" class="ponteiro" data-ponteiro="hora">
        <line class="visivel" x1="0" y1="14" x2="0" y2="-92" stroke="var(--cor-hora)" stroke-width="16" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="-100" stroke="rgba(0,0,0,0)" stroke-width="44" pointer-events="stroke" data-ponteiro="hora"/>
      </g>
      <circle r="13" fill="#ffd54a" stroke="#f2b600" stroke-width="4" pointer-events="none"/>
    </svg>
  </div>

  <div id="digital">2:00</div>
  <div id="extenso"></div>

  <div id="opcoes" hidden></div>

  <div class="acoes">
    <button id="btnSortear">🎲 Girar aleatório</button>
    <button id="btnConferir" hidden>✅ Conferir</button>
    <button id="btnFalar">🔊 Ouvir</button>
    <button id="btnAgora">🕒 Hora de agora</button>
  </div>

  <details class="config">
    <summary>⚙️ Configurações (professor)</summary>
    <label>Nível:
      <select id="nivel">
        <option value="60">Horas cheias (3:00)</option>
        <option value="30">Meias horas (3:30)</option>
        <option value="15" selected>Quartos de hora (3:15, 3:45)</option>
        <option value="5">De 5 em 5 minutos</option>
        <option value="1">Qualquer minuto</option>
      </select>
    </label>
    <label><input type="checkbox" id="chkDigital" checked> Mostrar relógio digital</label>
    <label><input type="checkbox" id="chkExtenso" checked> Mostrar hora por extenso</label>
    <label><input type="checkbox" id="chkMinutos" checked> Mostrar minutos no anel azul (05, 10, 15…)</label>
    <label><input type="checkbox" id="chkSom" checked> Sons</label>
  </details>

  <div class="legenda">
    <span><i style="width:30px;background:var(--cor-hora)"></i> Curto = HORAS</span>
    <span><i style="width:50px;background:var(--cor-min)"></i> Longo = MINUTOS</span>
  </div>
</main>

<div id="feedback"></div>

<script>
// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const svg = $('relogio');
const norm = t => ((Math.round(t) % 720) + 720) % 720;

let total = 120;        // minutos desde 12:00 (0 a 719)
let modo = 'livre';
let alvo = null;
let pontos = 0;
let travado = false;
let animando = false;
let revelar = false;

// ---------- Monta o mostrador ----------
(function montar(){
  const rad = g => g * Math.PI / 180;
  for (let i = 0; i < 60; i++){
    const a = rad(i * 6), grande = i % 5 === 0;
    const r1 = grande ? 150 : 160, r2 = 170;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', Math.sin(a) * r1); l.setAttribute('y1', -Math.cos(a) * r1);
    l.setAttribute('x2', Math.sin(a) * r2); l.setAttribute('y2', -Math.cos(a) * r2);
    l.setAttribute('stroke', grande ? '#5bb4f0' : '#c9ccd4');
    l.setAttribute('stroke-width', grande ? 5 : 2.5);
    l.setAttribute('stroke-linecap', 'round');
    $('ticks').appendChild(l);
  }
  for (let h = 1; h <= 12; h++){
    const a = rad(h * 30);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', Math.sin(a) * 124); t.setAttribute('y', -Math.cos(a) * 124);
    t.setAttribute('class', 'num-hora'); t.textContent = h;
    $('numeros').appendChild(t);
  }
  for (let m = 0; m < 60; m += 5){
    const a = rad(m * 6);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', Math.sin(a) * 185); t.setAttribute('y', -Math.cos(a) * 185);
    t.setAttribute('class', 'num-min'); t.textContent = String(m).padStart(2, '0');
    $('minutos').appendChild(t);
  }
})();

// ---------- Texto por extenso ----------
const HORAS = ['doze','uma','duas','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze'];
const UNID = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const DEZ = {20:'vinte',30:'trinta',40:'quarenta',50:'cinquenta'};
function num(n){
  if (n < 20) return UNID[n];
  const d = Math.floor(n / 10) * 10, u = n % 10;
  return u ? DEZ[d] + ' e ' + UNID[u] : DEZ[d];
}
function partes(t){
  t = norm(t);
  const h = Math.floor(t / 60), m = t % 60;
  return { hn: h === 0 ? 12 : h, m };
}
function digital(t){
  const {hn, m} = partes(t);
  return hn + ':' + String(m).padStart(2, '0');
}
function extenso(t){
  const {hn, m} = partes(t);
  const nomeH = HORAS[hn];
  const verbo = hn === 1 ? 'É' : 'São';
  let principal, alt = '';
  if (m === 0) principal = hn === 1 ? 'É uma hora' : `São ${nomeH} horas`;
  else if (m === 30) principal = `${verbo} ${nomeH} e meia`;
  else principal = `${verbo} ${nomeH} ${hn === 1 ? 'hora' : 'horas'} e ${num(m)} ${m === 1 ? 'minuto' : 'minutos'}`;

  if (m === 0 && hn === 12) alt = 'meio-dia ou meia-noite';
  else if (m === 15) alt = `ou: ${nomeH} e quinze`;
  else if (m >= 40 && m % 5 === 0){
    const prox = hn % 12 + 1;
    alt = `ou: ${num(60 - m)} para ${prox === 1 ? 'a' : 'as'} ${HORAS[prox]}`;
  }
  return {principal, alt};
}

// ---------- Desenho ----------
function render(t){
  const m = ((t % 60) + 60) % 60;
  $('ponteiroMin').setAttribute('transform', `rotate(${m * 6})`);
  $('ponteiroHora').setAttribute('transform', `rotate(${(((t % 720) + 720) % 720) / 2})`);
  $('digital').textContent = digital(t);
  const e = extenso(t);
  $('extenso').innerHTML = e.principal + (e.alt ? `<small>${e.alt}</small>` : '');
}
function atualizarVisibilidade(){
  const livre = modo === 'livre';
  $('digital').hidden = !($('chkDigital').checked && (livre || revelar));
  $('extenso').hidden = !($('chkExtenso').checked && (livre || revelar));
  $('minutos').style.display = $('chkMinutos').checked ? '' : 'none';
}

// ---------- Sons ----------
let ac;
function tom(freq, dur = .12, tipo = 'sine', vol = .15, atraso = 0){
  if (!$('chkSom').checked) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    const t0 = ac.currentTime + atraso;
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur);
  }catch(e){}
}
const somClique = () => tom(1400, .03, 'square', .03);
const somAcerto = () => [523,659,784,1047].forEach((f,i) => tom(f, .2, 'triangle', .18, i * .1));
const somErro = () => { tom(240, .25, 'sawtooth', .08); tom(180, .3, 'sawtooth', .08, .15); };
const somGiro = () => { for (let i = 0; i < 8; i++) tom(400 + i * 90, .08, 'triangle', .07, i * .07); };

// ---------- Voz ----------
function falar(texto){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR'; u.rate = .9;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ---------- Arrastar ponteiros (toque e mouse) ----------
let arrastando = null;
const passoArraste = () => +$('nivel').value === 1 ? 1 : 5;
const difAng = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

function posicao(e){
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  let a = Math.atan2(p.x, -p.y) * 180 / Math.PI;
  if (a < 0) a += 360;
  return {a, r: Math.hypot(p.x, p.y)};
}

svg.addEventListener('pointerdown', e => {
  if (travado || animando) return;
  const {a, r} = posicao(e);
  if (r > 200) return;
  const el = e.target.closest('[data-ponteiro]');
  let qual = el ? el.dataset.ponteiro : null;
  if (!qual){
    const dM = difAng(a, (total % 60) * 6), dH = difAng(a, total / 2);
    qual = r > 105 ? 'min' : (dH <= dM ? 'hora' : 'min');
  }
  arrastando = qual;
  svg.classList.add('arrastando-' + qual);
  svg.setPointerCapture(e.pointerId);
  mover(e);
  e.preventDefault();
});
svg.addEventListener('pointermove', e => { if (arrastando) mover(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev =>
  svg.addEventListener(ev, () => { arrastando = null; svg.classList.remove('arrastando-min','arrastando-hora'); })
);

function mover(e){
  const {a} = posicao(e);
  const passo = passoArraste();
  let novoTotal = total;
  if (arrastando === 'min'){
    const novo = (Math.round(a / 6 / passo) * passo) % 60;
    let d = novo - (total % 60);
    if (d > 30) d -= 60;
    if (d < -30) d += 60;
    novoTotal = norm(total + d);   // ponteiro das horas acompanha, como num relógio de verdade
  } else {
    novoTotal = norm(Math.round(a * 2 / passo) * passo);
  }
  if (novoTotal !== total){
    total = novoTotal;
    somClique();
    render(total);
  }
}

// ---------- Giro animado ----------
function sortearHora(){
  const passo = +$('nivel').value;
  let t;
  do { t = Math.floor(Math.random() * (720 / passo)) * passo; } while (t === total);
  return t;
}
function girarPara(destino, aoTerminar){
  animando = true;
  somGiro();
  const inicio = total;
  const fim = inicio + 120 + (((destino - inicio - 120) % 720) + 720) % 720;
  const dur = Math.min(2600, 900 + (fim - inicio) * 2.2);
  const t0 = performance.now();
  function quadro(agora){
    const k = Math.min(1, (agora - t0) / dur);
    const ease = 1 - Math.pow(1 - k, 3);
    render(inicio + (fim - inicio) * ease);
    if (k < 1) requestAnimationFrame(quadro);
    else { total = norm(destino); render(total); animando = false; aoTerminar && aoTerminar(); }
  }
  requestAnimationFrame(quadro);
}

// ---------- Feedback ----------
let timerFeedback;
function mostrarFeedback(emoji, texto){
  const f = $('feedback');
  f.innerHTML = `<span class="emoji">${emoji}</span>${texto}`;
  f.classList.add('mostrar');
  clearTimeout(timerFeedback);
  timerFeedback = setTimeout(() => f.classList.remove('mostrar'), 1700);
}
function confete(){
  const itens = ['⭐','🎉','✨','🌟','🎈'];
  for (let i = 0; i < 28; i++){
    const s = document.createElement('span');
    s.className = 'confete';
    s.textContent = itens[i % itens.length];
    s.style.left = '50%'; s.style.top = '40%';
    s.style.setProperty('--dx', (Math.random() * 600 - 300) + 'px');
    s.style.setProperty('--dy', (Math.random() * 500 - 300) + 'px');
    s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  }
}
function ganharPonto(){
  pontos++;
  $('placar').textContent = '⭐ ' + pontos;
  somAcerto(); confete();
}

// ---------- Modos ----------
function mudarModo(novo){
  modo = novo; revelar = false; alvo = null;
  document.querySelectorAll('.modos button').forEach(b => b.classList.toggle('ativo', b.dataset.modo === novo));
  $('enunciado').hidden = novo === 'livre';
  $('opcoes').hidden = novo !== 'qual';
  $('btnConferir').hidden = novo !== 'acertar';
  $('btnAgora').hidden = novo !== 'livre';
  $('btnSortear').textContent = novo === 'livre' ? '🎲 Girar aleatório' : '🎲 Nova pergunta';
  travado = novo === 'qual';
  atualizarVisibilidade();
  if (novo === 'acertar') novoDesafioAcertar();
  if (novo === 'qual') novoDesafioQual();
}

// Modo "Acerte o relógio": a criança move os ponteiros até a hora pedida
function novoDesafioAcertar(){
  revelar = false; atualizarVisibilidade();
  alvo = sortearHora();
  const e = extenso(alvo);
  $('enunciado').innerHTML = `Mexa os ponteiros até: <b>${digital(alvo)}</b><small>${e.principal}</small>`;
}
function conferirAcertar(){
  if (alvo === null || animando) return;
  if (total === alvo){
    ganharPonto();
    revelar = true; atualizarVisibilidade();
    mostrarFeedback('🎉', 'Muito bem!<br>' + extenso(alvo).principal);
    setTimeout(novoDesafioAcertar, 2000);
  } else {
    somErro();
    const {hn, m} = partes(total), alvoP = partes(alvo);
    let dica;
    if (m !== alvoP.m) dica = 'Olhe o ponteiro <span style="color:var(--cor-min)">LONGO</span> (minutos)';
    else dica = 'Os minutos estão certos!<br>Agora o ponteiro <span style="color:var(--cor-hora)">CURTO</span> (horas)';
    mostrarFeedback('🤔', 'Quase!<br><small>' + dica + '</small>');
  }
}

// Modo "Que horas são?": o relógio mostra e a criança escolhe a resposta
function novoDesafioQual(){
  revelar = false; atualizarVisibilidade();
  $('enunciado').innerHTML = 'Que horas são?';
  $('opcoes').innerHTML = '';
  alvo = sortearHora();
  girarPara(alvo, () => montarOpcoes(alvo));
}
function montarOpcoes(certa){
  const passo = +$('nivel').value;
  const {hn, m} = partes(certa);
  const h = hn % 12;
  const ops = new Set([certa]);
  const candidatos = [];
  if (m % 5 === 0) candidatos.push((m / 5) * 60 + h * 5);   // ponteiros trocados (erro comum)
  candidatos.push(certa + 60, certa - 60, certa + passo, certa - passo, certa + 30, certa - 30);
  candidatos.sort(() => Math.random() - .5);
  for (const c of candidatos){ if (ops.size >= 4) break; ops.add(norm(c)); }
  while (ops.size < 4) ops.add(norm(Math.floor(Math.random() * (720 / passo)) * passo));
  const lista = [...ops].sort(() => Math.random() - .5);
  let respondeu = false;
  lista.forEach(t => {
    const b = document.createElement('button');
    b.textContent = digital(t);
    b.onclick = () => {
      if (respondeu) return;
      if (t === certa){
        respondeu = true;
        b.classList.add('certa');
        ganharPonto();
        revelar = true; atualizarVisibilidade();
        mostrarFeedback('🎉', 'Acertou!<br>' + extenso(certa).principal);
        falar(extenso(certa).principal);
        setTimeout(novoDesafioQual, 2200);
      } else {
        b.classList.add('errada'); b.disabled = true;
        somErro();
        mostrarFeedback('🤔', 'Tente de novo!<br><small>O ponteiro curto mostra a hora</small>');
      }
    };
    $('opcoes').appendChild(b);
  });
}

// ---------- Botões ----------
document.querySelectorAll('.modos button').forEach(b => b.onclick = () => { if (!animando) mudarModo(b.dataset.modo); });
$('btnSortear').onclick = () => {
  if (animando) return;
  if (modo === 'livre') girarPara(sortearHora());
  else if (modo === 'acertar') novoDesafioAcertar();
  else novoDesafioQual();
};
$('btnConferir').onclick = conferirAcertar;
$('btnAgora').onclick = () => {
  if (animando) return;
  const d = new Date();
  girarPara((d.getHours() % 12) * 60 + d.getMinutes());
};
$('btnFalar').onclick = () => {
  if (modo === 'livre') falar(extenso(total).principal);
  else if (modo === 'acertar' && alvo !== null) falar('Coloque os ponteiros em: ' + extenso(alvo).principal);
  else falar('Que horas são?');
};
['chkDigital','chkExtenso','chkMinutos'].forEach(id => $(id).onchange = atualizarVisibilidade);
$('nivel').onchange = () => { if (modo !== 'livre') mudarModo(modo); };
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

// ---------- Início ----------
render(total);
atualizarVisibilidade();
</script>
</body>
</html>
